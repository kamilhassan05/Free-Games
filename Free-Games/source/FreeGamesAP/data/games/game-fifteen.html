<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect Four · Free Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4ff;--surface:#fff;--ink:#1a1b3a;--muted:#5b5f85;--line:#dde1f7;--blue:#3b4bff;
  --yellow:#ffc93c;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#14152e;--surface:#1d1f40;--ink:#eef0ff;--muted:#a2a6d0;--line:#2d3060;--blue:#6f7bff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:1rem;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
header,.stats,.status,.stage,.controls{width:min(100%,440px,calc((100dvh - 290px) * 7 / 6));min-width:min(100%,300px)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.back{padding:.5rem 1rem;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;box-shadow:inset 0 0 0 2px var(--line);background:var(--surface)}
h1{font:800 1.5rem var(--display);margin:0;letter-spacing:-.02em}
.mute{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:1.2rem;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.stats{display:flex;justify-content:space-between;gap:.5rem;font-weight:700}
.stats span{background:var(--surface);padding:.35rem .9rem;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line)}
.status{text-align:center;font:800 1.25rem var(--display);letter-spacing:-.01em;min-height:1.6em}
.stage{position:relative;background:#1d1f40;padding:10px;border-radius:24px;box-shadow:0 0 0 3px var(--line);user-select:none;-webkit-user-select:none}
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;aspect-ratio:7/6;background:#3d4388;border-radius:16px;padding:6px;overflow:hidden}
.col{display:grid;grid-template-rows:repeat(6,minmax(0,1fr));gap:4px;min-width:0;min-height:0;border:0;padding:0;border-radius:10px;background:none;cursor:pointer;touch-action:manipulation}
.col:not(:disabled):hover{background:rgba(255,255,255,.1)}
.col:disabled{cursor:default}
.cell{position:relative;border-radius:50%;background:#14152e;min-width:0;min-height:0}
.disc{position:absolute;inset:7%;border-radius:50%;animation:drop .38s cubic-bezier(.4,0,.9,.55)}
.disc.r{background:#ff6b6b;box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}
.disc.y{background:#ffc93c;box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}
.disc.win{animation:pulse .7s ease-in-out infinite alternate;box-shadow:0 0 0 3px #eef0ff,0 0 18px #eef0ff}
@keyframes drop{from{transform:translateY(var(--from))}to{transform:none}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.1)}}
.overlay{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:.6rem;text-align:center;padding:1.25rem;border-radius:24px;background:rgba(20,21,46,.92);color:#eef0ff;z-index:5}
.overlay[hidden]{display:none}
.overlay h2{font:800 2.2rem var(--display);margin:0;letter-spacing:-.02em}
.overlay p{margin:0;color:#c3c7ee;max-width:30ch}
.btn{border:0;border-radius:999px;padding:.8rem 2rem;font:700 1.05rem var(--body);background:var(--yellow);color:#1a1b3a;cursor:pointer}
.btn.ghost{background:transparent;color:#eef0ff;box-shadow:inset 0 0 0 2px #5b5f85}
.picks{display:flex;flex-direction:column;gap:.5rem;width:min(100%,260px);margin-top:.3rem}
.picks .btn{width:100%;padding:.65rem 2rem}.picks small{display:block;font-weight:500;opacity:.75}
.controls{display:flex;gap:.5rem}
.soft{flex:1;border:0;cursor:pointer;padding:.65rem;border-radius:999px;background:var(--surface);color:var(--ink);font:500 .95rem var(--body);box-shadow:inset 0 0 0 2px var(--line)}
@media (prefers-reduced-motion:reduce){.disc{animation:none}.disc.win{animation:none}}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&larr; All games</a>
  <h1>Connect Four</h1>
  <button class="mute" id="mute" aria-label="Mute sound" aria-pressed="false">🔊</button>
</header>
<div class="stats">
  <span><span id="l1">You</span> <b id="s1">0</b></span>
  <span>Draws <b id="s2">0</b></span>
  <span><span id="l3">CPU</span> <b id="s3">0</b></span>
</div>
<div class="status" id="status" aria-live="polite">&nbsp;</div>
<div class="stage" id="stage">
  <div class="board" id="board"></div>
  <div class="overlay" id="menu">
    <h2>Connect Four</h2>
    <p>Drop discs and get four in a row, in any direction.</p>
    <div class="picks">
      <button class="btn pick" data-l="easy">Easy<small>Relaxed computer</small></button>
      <button class="btn pick" data-l="medium">Medium<small>Thinks a couple of moves ahead</small></button>
      <button class="btn pick" data-l="hard">Hard<small>Plans far ahead</small></button>
      <button class="btn pick ghost" data-l="two">2 Players<small>Take turns on one screen</small></button>
    </div>
  </div>
  <div class="overlay" id="msg" hidden>
    <h2 id="mtitle"></h2>
    <p id="mtext"></p>
    <button class="btn" id="mainBtn">Next round</button>
    <button class="btn ghost" id="altBtn">Change level</button>
  </div>
</div>
<div class="controls">
  <button class="soft" id="restart">Restart round</button>
  <button class="soft" id="change">Change level</button>
</div>

<script>
const $ = id => document.getElementById(id);
const COLS = 7, ROWS = 6, ORDER = [3, 2, 4, 1, 5, 0, 6];
const DEPTH = { easy: 0, medium: 2, hard: 6 };
let mode = "medium", b, turn = 1, starter = 1, state = "menu", busy = false, stats = { w: 0, d: 0, l: 0 }, cellEls = [], colEls = [];
const isAI = () => mode !== "two";
const NAME = p => isAI() ? (p === 1 ? "You" : "Computer") : (p === 1 ? "Red" : "Yellow");

/* Audio (synthesized, no files needed) */
let actx = null, muted = false;
try { muted = localStorage.getItem("c4-muted") === "1"; } catch(e) {}
function ac(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(f, d, type = "sine", v = .1, when = 0, to){
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
}
const sfx = {
  drop(r){ tone(260 - r * 14, .1, "triangle", .14, .3, 120); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, "square", .06, i * .1)); },
  lose(){ [330, 262, 196].forEach((f, i) => tone(f, .22, "triangle", .12, i * .16)); },
  draw(){ tone(330, .2, "triangle", .1); tone(330, .25, "triangle", .1, .22); },
  start(){ [392, 523, 659].forEach((f, i) => tone(f, .1, "square", .05, i * .08)); }
};
function paintMute(){ const m = $("mute"); m.textContent = muted ? "🔇" : "🔊"; m.setAttribute("aria-pressed", muted); m.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound"); }
$("mute").addEventListener("click", () => {
  muted = !muted; paintMute();
  try { localStorage.setItem("c4-muted", muted ? "1" : "0"); } catch(e) {}
  if (!muted) ac();
});
paintMute();

/* Rules + AI. b[c][r], r = 0 is the bottom row. 0 empty, 1 red, 2 yellow */
const newBoard = () => Array.from({ length: COLS }, () => Array(ROWS).fill(0));
const rowOf = (bd, c) => bd[c].indexOf(0);
const validCols = bd => ORDER.filter(c => bd[c][ROWS - 1] === 0);
function lineAt(bd, c, r, p){
  for (const [dc, dr] of [[1, 0], [0, 1], [1, 1], [1, -1]]){
    const cells = [[c, r]];
    for (const s of [1, -1]) for (let k = 1; k < 4; k++){
      const cc = c + dc * k * s, rr = r + dr * k * s;
      if (cc < 0 || cc >= COLS || rr < 0 || rr >= ROWS || bd[cc][rr] !== p) break; cells.push([cc, rr]);
    }
    if (cells.length >= 4) return cells;
  }
  return null;
}
function evalBoard(bd){
  let s = 0; for (let r = 0; r < ROWS; r++) if (bd[3][r] === 2) s += 3; else if (bd[3][r] === 1) s -= 3;
  const win = (c, r, dc, dr) => {
    let a = 0, o = 0;
    for (let k = 0; k < 4; k++){ const v = bd[c + dc * k][r + dr * k]; if (v === 2) a++; else if (v === 1) o++; }
    if (a && o) return 0;
    if (a === 3) return 5; if (a === 2) return 2; if (o === 3) return -6; if (o === 2) return -2; return 0;
  };
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++){
    if (c + 3 < COLS) s += win(c, r, 1, 0);
    if (r + 3 < ROWS) s += win(c, r, 0, 1);
    if (c + 3 < COLS && r + 3 < ROWS) s += win(c, r, 1, 1);
    if (c + 3 < COLS && r - 3 >= 0) s += win(c, r, 1, -1);
  }
  return s;
}
function minimax(bd, depth, alpha, beta, max, last){
  if (last && lineAt(bd, last.c, last.r, last.p)) return (last.p === 2 ? 1 : -1) * (1e6 + depth);
  const cols = validCols(bd); if (!cols.length) return 0;
  if (depth === 0) return evalBoard(bd);
  let best = max ? -Infinity : Infinity;
  for (const c of cols){
    const r = rowOf(bd, c), p = max ? 2 : 1; bd[c][r] = p;
    const v = minimax(bd, depth - 1, alpha, beta, !max, { c, r, p }); bd[c][r] = 0;
    if (max){ best = Math.max(best, v); alpha = Math.max(alpha, v); } else { best = Math.min(best, v); beta = Math.min(beta, v); }
    if (beta <= alpha) break;
  }
  return best;
}
function aiChoose(){
  const cols = validCols(b);
  const wins = p => cols.find(c => { const r = rowOf(b, c); b[c][r] = p; const w = lineAt(b, c, r, p); b[c][r] = 0; return w; });
  if (mode === "easy"){
    if (Math.random() < .5){ const w = wins(2); if (w != null) return w; const k = wins(1); if (k != null) return k; }
    return cols[Math.floor(Math.random() * cols.length)];
  }
  let bestS = -Infinity, pick = [];
  for (const c of cols){
    const r = rowOf(b, c); b[c][r] = 2;
    const v = minimax(b, DEPTH[mode] - 1, -Infinity, Infinity, false, { c, r, p: 2 }); b[c][r] = 0;
    if (v > bestS){ bestS = v; pick = [c]; } else if (v === bestS) pick.push(c);
  }
  return pick[Math.floor(Math.random() * pick.length)];
}

/* UI */
const key = () => "c4-stats-" + mode;
function loadStats(){ try { stats = JSON.parse(localStorage.getItem(key())) || { w: 0, d: 0, l: 0 }; } catch(e) { stats = { w: 0, d: 0, l: 0 }; } }
function saveStats(){ try { localStorage.setItem(key(), JSON.stringify(stats)); } catch(e) {} }
function hud(){
  $("l1").textContent = isAI() ? "You" : "Red"; $("l3").textContent = isAI() ? "CPU" : "Yellow";
  $("s1").textContent = stats.w; $("s2").textContent = stats.d; $("s3").textContent = stats.l;
}
function setStatus(){
  if (state !== "play"){ $("status").innerHTML = "&nbsp;"; return; }
  $("status").textContent = isAI() ? (turn === 1 ? "Your turn" : "Computer is thinking…") : (NAME(turn) + "’s turn");
}
function buildBoard(){
  const bo = $("board"); bo.innerHTML = ""; cellEls = []; colEls = [];
  for (let c = 0; c < COLS; c++){
    const col = document.createElement("button"); col.className = "col"; col.setAttribute("aria-label", "Drop in column " + (c + 1));
    cellEls[c] = [];
    for (let r = ROWS - 1; r >= 0; r--){ const cell = document.createElement("div"); cell.className = "cell"; col.appendChild(cell); cellEls[c][r] = cell; }
    col.addEventListener("click", () => humanMove(c)); bo.appendChild(col); colEls.push(col);
  }
}
function refreshCols(){ colEls.forEach((el, c) => { el.disabled = state !== "play" || busy || b[c][ROWS - 1] !== 0 || (isAI() && turn === 2); }); }
function newRound(){
  b = newBoard(); turn = starter; state = "play"; busy = false; $("msg").hidden = true;
  buildBoard(); refreshCols(); setStatus(); if (isAI() && turn === 2) aiTurn();
}
function startMode(m){ mode = m; starter = 1; loadStats(); hud(); $("menu").hidden = true; ac(); sfx.start(); newRound(); }
function showMenu(){ state = "menu"; busy = false; $("msg").hidden = true; $("menu").hidden = false; b = newBoard(); buildBoard(); refreshCols(); setStatus(); }
function humanMove(c){ if (state !== "play" || busy || (isAI() && turn === 2)) return; ac(); play(c); }
function aiTurn(){ busy = true; refreshCols(); setTimeout(() => { if (state === "play" && turn === 2){ busy = false; play(aiChoose()); } }, 550); }
function play(c){
  const r = rowOf(b, c); if (r < 0) return;
  b[c][r] = turn; const d = document.createElement("div");
  d.className = "disc " + (turn === 1 ? "r" : "y"); d.style.setProperty("--from", "translateY(" + (-(ROWS - r) * 120) + "%)");
  cellEls[c][r].appendChild(d); sfx.drop(r);
  const line = lineAt(b, c, r, turn);
  if (line) return end(line, turn);
  if (!validCols(b).length) return end(null, 0);
  turn = turn === 1 ? 2 : 1; busy = true; refreshCols(); setStatus();
  setTimeout(() => { busy = false; refreshCols(); if (isAI() && turn === 2 && state === "play") aiTurn(); }, 380);
}
function end(line, p){
  state = "over"; busy = false; refreshCols(); setStatus();
  let title;
  if (line){
    setTimeout(() => line.forEach(([c, r]) => cellEls[c][r].firstChild && cellEls[c][r].firstChild.classList.add("win")), 380);
    if (p === 1) stats.w++; else stats.l++;
    title = isAI() ? (p === 1 ? "You win!" : "Computer wins") : (NAME(p) + " wins!");
    setTimeout(isAI() && p === 2 ? sfx.lose : sfx.win, 420);
  } else { stats.d++; title = "It’s a draw"; setTimeout(sfx.draw, 420); }
  saveStats(); hud(); starter = starter === 1 ? 2 : 1;
  const next = isAI() ? (starter === 1 ? "You go first next round." : "The computer goes first next round.") : (NAME(starter) + " goes first next round.");
  setTimeout(() => { if (state === "over"){ $("mtitle").textContent = title; $("mtext").textContent = next; $("msg").hidden = false; $("mainBtn").focus(); } }, line ? 1500 : 900);
}

document.querySelectorAll(".pick").forEach(x => x.addEventListener("click", () => startMode(x.dataset.l)));
$("mainBtn").addEventListener("click", newRound);
$("altBtn").addEventListener("click", showMenu);
$("restart").addEventListener("click", () => { if (state !== "menu") newRound(); });
$("change").addEventListener("click", showMenu);
b = newBoard(); buildBoard(); loadStats(); hud(); refreshCols();
</script>
</body>
</html>
