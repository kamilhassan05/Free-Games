<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Match · Free Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4ff;--surface:#fff;--ink:#1a1b3a;--muted:#5b5f85;--line:#dde1f7;--blue:#3b4bff;--on-blue:#fff;
  --yellow:#ffc93c;--mint:#25b896;--coral:#ff6b6b;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#14152e;--surface:#1d1f40;--ink:#eef0ff;--muted:#a2a6d0;--line:#2d3060;--blue:#6f7bff;--on-blue:#10112a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:1rem;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
header,.stats,.controls,.stage{width:min(100%,460px)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.back{padding:.5rem 1rem;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;box-shadow:inset 0 0 0 2px var(--line);background:var(--surface)}
h1{font:800 1.5rem var(--display);margin:0;letter-spacing:-.02em}
.mute{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:1.2rem;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.stats{display:flex;justify-content:space-between;gap:.5rem;font-weight:700}
.stats span{background:var(--surface);padding:.35rem .9rem;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line)}
.stage{position:relative;background:#1d1f40;padding:12px;border-radius:24px;box-shadow:0 0 0 3px var(--line)}
.board{container-type:inline-size;display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:10px}
.card{position:relative;aspect-ratio:1;border:0;padding:0;background:none;cursor:pointer;perspective:600px;font-size:calc(100cqw / var(--cols) * .46)}
.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;backface-visibility:hidden;transition:transform .35s}
.back-face{background:#6f7bff;color:#10112a;font:800 calc(100cqw / var(--cols) * .4) var(--display);box-shadow:inset 0 0 0 4px rgba(255,255,255,.18)}
.front-face{background:#2a2d5c;box-shadow:inset 0 0 0 3px #3a3e78;transform:rotateY(180deg)}
.card.open .back-face{transform:rotateY(180deg)}
.card.open .front-face{transform:rotateY(360deg)}
.card.done .front-face{background:#1f4a50;box-shadow:inset 0 0 0 3px #25b896}
.card.bad .front-face{box-shadow:inset 0 0 0 3px #ff6b6b}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;text-align:center;padding:1.5rem;border-radius:24px;background:rgba(20,21,46,.9);color:#eef0ff}
.overlay[hidden]{display:none}
.overlay h2{font:800 2.2rem var(--display);margin:0;letter-spacing:-.02em}
.overlay p{margin:0;color:#c3c7ee}
.btn{border:0;border-radius:999px;padding:.85rem 2rem;font:700 1.05rem var(--body);background:var(--yellow);color:#1a1b3a;cursor:pointer;margin-top:.5rem}
.picks{display:flex;flex-direction:column;gap:.6rem;width:min(100%,260px);margin-top:.5rem}
.picks .btn{margin:0;width:100%}
.picks small{display:block;font-weight:500;opacity:.75}
.controls{display:flex;gap:.5rem}
.ghost{flex:1;border:0;cursor:pointer;padding:.65rem;border-radius:999px;background:var(--surface);color:var(--ink);font:500 .95rem var(--body);box-shadow:inset 0 0 0 2px var(--line)}
@media (prefers-reduced-motion:reduce){.face{transition:none}}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&larr; All games</a>
  <h1>Memory Match</h1>
  <button class="mute" id="mute" aria-label="Mute sound" aria-pressed="false">🔊</button>
</header>
<div class="stats" aria-live="polite">
  <span>Moves <b id="moves">0</b></span>
  <span>Time <b id="time">0:00</b></span>
  <span>Best <b id="best">–</b></span>
</div>
<div class="stage">
  <div class="board" id="board"></div>
  <div class="overlay" id="menu">
    <h2>Memory Match</h2>
    <p>Choose a level to start.</p>
    <div class="picks">
      <button class="btn pick" data-l="easy">Easy<small>6 pairs</small></button>
      <button class="btn pick" data-l="medium">Medium<small>8 pairs</small></button>
      <button class="btn pick" data-l="hard">Hard<small>12 pairs</small></button>
    </div>
  </div>
  <div class="overlay" id="win" hidden>
    <h2>You win!</h2>
    <p id="wtext"></p>
    <button class="btn" id="again">Play again</button>
    <button class="btn" id="changeWin" style="background:transparent;color:#eef0ff;box-shadow:inset 0 0 0 2px #5b5f85;margin-top:0">Change level</button>
  </div>
</div>
<div class="controls">
  <button class="ghost" id="restart">Restart</button>
  <button class="ghost" id="change">Change level</button>
</div>

<script>
const $ = id => document.getElementById(id);
const LEVELS = { easy:{cols:4,pairs:6}, medium:{cols:4,pairs:8}, hard:{cols:6,pairs:12} };
const EMOJI = ["🐶","🐱","🦊","🐼","🐸","🐵","🦁","🐯","🐰","🐨","🐮","🐷"];
let level = "medium", first = null, lock = false, moves = 0, found = 0, secs = 0, timer = null;

/* Audio (synthesized, no files needed) */
let actx = null, muted = false;
try { muted = localStorage.getItem("memory-muted") === "1"; } catch(e) {}
function ac(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(f, d, type = "sine", v = .1, when = 0, to){
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
}
const sfx = {
  flip(){ tone(520, .06, "triangle", .08); },
  match(){ tone(660, .1, "square", .06); tone(990, .16, "square", .06, .09); },
  miss(){ tone(220, .22, "sawtooth", .07, 0, 140); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, "square", .06, i * .12)); }
};
function paintMute(){ const b = $("mute"); b.textContent = muted ? "🔇" : "🔊"; b.setAttribute("aria-pressed", muted); b.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound"); }
$("mute").addEventListener("click", () => {
  muted = !muted; paintMute();
  try { localStorage.setItem("memory-muted", muted ? "1" : "0"); } catch(e) {}
  if (!muted) ac();
});
paintMute();

/* Game */
function getBest(){ try { return +localStorage.getItem("memory-best-" + level) || 0; } catch(e) { return 0; } }
function fmt(s){ return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function newGame(){
  clearInterval(timer); timer = null;
  first = null; lock = false; moves = 0; found = 0; secs = 0;
  const { cols, pairs } = LEVELS[level];
  const deck = shuffle([...EMOJI.slice(0, pairs), ...EMOJI.slice(0, pairs)]);
  const board = $("board");
  board.style.setProperty("--cols", cols);
  board.innerHTML = deck.map((e, i) =>
    `<button class="card" data-e="${e}" aria-label="Hidden card ${i + 1}">
       <span class="face back-face" aria-hidden="true">?</span><span class="face front-face" aria-hidden="true">${e}</span></button>`).join("");
  $("moves").textContent = 0; $("time").textContent = "0:00";
  const b = getBest(); $("best").textContent = b ? b : "–";
  $("win").hidden = true;
}

$("board").addEventListener("click", ev => {
  const c = ev.target.closest(".card");
  if (!c || lock || c.classList.contains("open") || c.classList.contains("done")) return;
  ac();
  if (!timer) timer = setInterval(() => { secs++; $("time").textContent = fmt(secs); }, 1000);
  c.classList.add("open"); c.setAttribute("aria-label", "Card " + c.dataset.e); sfx.flip();
  if (!first){ first = c; return; }
  moves++; $("moves").textContent = moves;
  const a = first; first = null;
  if (a.dataset.e === c.dataset.e){
    a.classList.add("done"); c.classList.add("done"); found++; setTimeout(sfx.match, 250);
    if (found === LEVELS[level].pairs) setTimeout(win, 600);
  } else {
    lock = true; a.classList.add("bad"); c.classList.add("bad"); setTimeout(sfx.miss, 250);
    setTimeout(() => {
      [a, c].forEach(x => { x.classList.remove("open", "bad"); x.setAttribute("aria-label", "Hidden card"); });
      lock = false;
    }, 900);
  }
});

function win(){
  clearInterval(timer); timer = null;
  const prev = getBest(); let note = "";
  if (!prev || moves < prev){
    try { localStorage.setItem("memory-best-" + level, moves); } catch(e) {}
    $("best").textContent = moves; note = prev ? " New best!" : "";
  }
  $("wtext").textContent = "Done in " + moves + " moves and " + fmt(secs) + "." + note;
  $("win").hidden = false; sfx.win(); $("again").focus();
}

function showMenu(){
  clearInterval(timer); timer = null; $("win").hidden = true; $("menu").hidden = false;
  const f = document.querySelector(".pick"); if (f) f.focus();
}
document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => {
  level = b.dataset.l; ac(); newGame(); $("menu").hidden = true; sfx.flip();
}));
$("again").addEventListener("click", newGame);
$("restart").addEventListener("click", newGame);
$("change").addEventListener("click", showMenu);
$("changeWin").addEventListener("click", showMenu);
newGame();
</script>
</body>
</html>
