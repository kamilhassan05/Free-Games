<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Blaster · Free Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4ff;--surface:#fff;--ink:#1a1b3a;--muted:#5b5f85;--line:#dde1f7;--blue:#3b4bff;
  --yellow:#ffc93c;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#14152e;--surface:#1d1f40;--ink:#eef0ff;--muted:#a2a6d0;--line:#2d3060;--blue:#6f7bff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:1rem;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
header,.stats{width:min(100%,440px)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.back{padding:.5rem 1rem;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;box-shadow:inset 0 0 0 2px var(--line);background:var(--surface)}
h1{font:800 1.5rem var(--display);margin:0;letter-spacing:-.02em}
.mute{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:1.2rem;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.stats{display:flex;justify-content:space-between;font-weight:700}
.stats span{background:var(--surface);padding:.35rem .9rem;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line)}
.stage{position:relative;width:min(100%,440px,calc((100dvh - 190px) * 2 / 3));aspect-ratio:2/3;border-radius:24px;overflow:hidden;background:#1d1f40;touch-action:none;box-shadow:0 0 0 3px var(--line)}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;text-align:center;padding:1.5rem;background:rgba(20,21,46,.88);color:#eef0ff}
.overlay[hidden]{display:none}
.overlay h2{font:800 2.2rem var(--display);margin:0;letter-spacing:-.02em}
.overlay p{margin:0;color:#c3c7ee;max-width:30ch}
.btn{border:0;border-radius:999px;padding:.85rem 2rem;font:700 1.05rem var(--body);background:var(--yellow);color:#1a1b3a;cursor:pointer}
.btn.ghost{background:transparent;color:#eef0ff;box-shadow:inset 0 0 0 2px #5b5f85}
.picks{display:flex;flex-direction:column;gap:.6rem;width:min(100%,260px);margin-top:.4rem}
.picks .btn{width:100%}
.picks small{display:block;font-weight:500;opacity:.75}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&larr; All games</a>
  <h1>Star Blaster</h1>
  <button class="mute" id="mute" aria-label="Mute sound" aria-pressed="false">🔊</button>
</header>
<div class="stats" aria-live="polite">
  <span>Score <b id="score">0</b></span>
  <span>Best <b id="best">0</b></span>
  <span id="lives" aria-label="Lives">♥♥♥</span>
</div>
<div class="stage" id="stage">
  <canvas id="c" width="400" height="600" aria-label="Star Blaster game board"></canvas>
  <div class="overlay" id="menu">
    <h2>Star Blaster</h2>
    <p>Your ship fires on its own. Steer it and stop the invaders.</p>
    <div class="picks">
      <button class="btn pick" data-l="easy">Easy<small>5 lives, slow invaders</small></button>
      <button class="btn pick" data-l="medium">Medium<small>3 lives</small></button>
      <button class="btn pick" data-l="hard">Hard<small>3 lives, fast invaders</small></button>
    </div>
    <p style="font-size:.9rem">Move with ← → or A / D, or drag on the screen.</p>
  </div>
  <div class="overlay" id="msg" hidden>
    <h2 id="mtitle"></h2>
    <p id="mtext"></p>
    <button class="btn" id="mainBtn"></button>
    <button class="btn ghost" id="altBtn">Change level</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $("c"), ctx = cv.getContext("2d"), W = 400, H = 600;
const LEVELS = {
  easy:   { lives: 5, spawn: 1.05, speed: 65,  fire: .30 },
  medium: { lives: 3, spawn: .85,  speed: 85,  fire: .26 },
  hard:   { lives: 3, spawn: .65,  speed: 110, fire: .24 }
};
let level = "medium", cfg = LEVELS.medium, state = "menu";
let score, lives, bullets, enemies, parts, px, target, t, spawnT, fireT, last, invuln, dir = 0, best = 0;
const P = { y: H - 56 };
const stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 40 + Math.random() * 90, r: Math.random() * 1.6 + .4 }));

/* Audio (synthesized, no files needed) */
let actx = null, muted = false, lastShot = 0;
try { muted = localStorage.getItem("blaster-muted") === "1"; } catch(e) {}
function ac(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(f, d, type = "sine", v = .1, when = 0, to){
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
}
const sfx = {
  shoot(){ tone(900, .07, "square", .02, 0, 500); },
  tick(){ tone(300, .05, "triangle", .06); },
  boom(){ tone(260, .22, "sawtooth", .08, 0, 60); },
  hit(){ tone(160, .4, "sawtooth", .16, 0, 45); },
  start(){ [392, 523, 659, 784].forEach((f, i) => tone(f, .12, "square", .06, i * .08)); },
  over(){ [392, 330, 262, 196].forEach((f, i) => tone(f, .22, "triangle", .12, i * .16)); }
};
function paintMute(){ const b = $("mute"); b.textContent = muted ? "🔇" : "🔊"; b.setAttribute("aria-pressed", muted); b.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound"); }
$("mute").addEventListener("click", () => {
  muted = !muted; paintMute();
  try { localStorage.setItem("blaster-muted", muted ? "1" : "0"); } catch(e) {}
  if (!muted) ac();
});
paintMute();

/* Game */
function loadBest(){ try { best = +localStorage.getItem("blaster-best-" + level) || 0; } catch(e) { best = 0; } $("best").textContent = best; }
function hud(){ $("score").textContent = score; $("lives").textContent = "♥".repeat(Math.max(lives, 0)) + "♡".repeat(Math.max(cfg.lives - lives, 0)); }
function reset(){
  score = 0; lives = cfg.lives; bullets = []; enemies = []; parts = [];
  px = W / 2; target = W / 2; t = 0; spawnT = .6; fireT = 0; invuln = 0; hud(); loadBest();
}
function startGame(l){
  level = l; cfg = LEVELS[l]; reset(); state = "playing";
  $("menu").hidden = true; $("msg").hidden = true; last = performance.now();
  ac(); sfx.start(); requestAnimationFrame(loop);
}
function showMsg(title, text, mainLabel){
  $("mtitle").textContent = title; $("mtext").textContent = text; $("mainBtn").textContent = mainLabel;
  $("msg").hidden = false; $("mainBtn").focus();
}
function showMenu(){ state = "menu"; $("msg").hidden = true; $("menu").hidden = false; reset(); draw(); }
function gameOver(){
  state = "over"; sfx.over();
  if (score > best){ best = score; $("best").textContent = best; try { localStorage.setItem("blaster-best-" + level, best); } catch(e) {} }
  showMsg("Game over", "You scored " + score + ". Best: " + best + ".", "Play again");
}
function burst(x, y, col, n){
  for (let i = 0; i < n; i++){
    const a = Math.random() * 6.28, s = 40 + Math.random() * 140;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .5 + Math.random() * .3, col });
  }
}
function loseLife(){
  lives--; hud(); sfx.hit(); invuln = 1.2; burst(px, P.y, "#6f7bff", 18);
  if (lives <= 0) { draw(); gameOver(); return true; }
  return false;
}
function spawn(){
  const big = score > 12 && Math.random() < .2, ramp = Math.min(1 + t / 45, 2.2);
  enemies.push({ x: 30 + Math.random() * (W - 60), y: -30, r: big ? 26 : 16, hp: big ? 3 : 1, max: big ? 3 : 1, big,
    v: cfg.speed * ramp * (big ? .6 : 1) * (.85 + Math.random() * .3), ph: Math.random() * 6, zig: !big && Math.random() < .4, rot: 0 });
}
function loop(now){
  if (state !== "playing") return;
  const dt = Math.min((now - last) / 1000, .05); last = now; t += dt;
  const ramp = Math.min(1 + t / 45, 2.2);

  target = Math.max(22, Math.min(W - 22, target + dir * 380 * dt));
  px += (target - px) * Math.min(1, dt * 18);
  invuln = Math.max(0, invuln - dt);

  fireT -= dt;
  if (fireT <= 0){
    bullets.push({ x: px, y: P.y - 20 }); fireT = cfg.fire;
    if (now - lastShot > 120){ sfx.shoot(); lastShot = now; }
  }
  spawnT -= dt;
  if (spawnT <= 0){ spawn(); spawnT = cfg.spawn / ramp * (.7 + Math.random() * .6); }

  for (let i = bullets.length - 1; i >= 0; i--){ bullets[i].y -= 520 * dt; if (bullets[i].y < -12) bullets.splice(i, 1); }

  for (let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i]; e.y += e.v * dt; e.rot += dt * 2;
    if (e.zig) e.x = Math.max(e.r, Math.min(W - e.r, e.x + Math.sin(t * 2 + e.ph) * 60 * dt));
    let dead = false;
    for (let j = bullets.length - 1; j >= 0; j--){
      const b = bullets[j];
      if (Math.abs(b.x - e.x) < e.r + 3 && Math.abs(b.y - e.y) < e.r + 8){
        bullets.splice(j, 1); e.hp--;
        if (e.hp <= 0){ dead = true; score += e.big ? 3 : 1; hud(); burst(e.x, e.y, e.big ? "#ffc93c" : "#ff6b6b", e.big ? 22 : 12); sfx.boom(); }
        else sfx.tick();
        break;
      }
    }
    if (dead){ enemies.splice(i, 1); continue; }
    if (invuln <= 0 && Math.hypot(e.x - px, e.y - P.y) < e.r + 14){
      enemies.splice(i, 1); burst(e.x, e.y, "#ff6b6b", 12);
      if (loseLife()) return; continue;
    }
    if (e.y > H + 30){ enemies.splice(i, 1); if (loseLife()) return; }
  }
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.life <= 0) parts.splice(i, 1);
  }
  for (const s of stars){ s.y += s.s * dt; if (s.y > H){ s.y = -2; s.x = Math.random() * W; } }
  draw(); requestAnimationFrame(loop);
}
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function draw(){
  ctx.fillStyle = "#1d1f40"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,.55)";
  for (const s of stars) ctx.fillRect(s.x, s.y, s.r, s.r);
  ctx.fillStyle = "#ffc93c"; for (const b of bullets) rr(b.x - 2, b.y - 8, 4, 14, 2);
  for (const e of enemies){
    ctx.save(); ctx.translate(e.x, e.y);
    if (e.big){
      ctx.fillStyle = "#ffc93c"; ctx.beginPath(); ctx.arc(0, 0, e.r, 0, 7); ctx.fill();
      ctx.fillStyle = "#e0a200"; ctx.beginPath(); ctx.arc(0, 0, e.r * (.35 + .4 * e.hp / e.max), 0, 7); ctx.fill();
    } else {
      ctx.rotate(e.rot); ctx.fillStyle = "#ff6b6b"; rr(-e.r, -e.r, e.r * 2, e.r * 2, 6);
      ctx.fillStyle = "#1d1f40"; rr(-4, -4, 8, 8, 2);
    }
    ctx.restore();
  }
  for (const p of parts){ ctx.globalAlpha = Math.max(p.life * 1.8, 0); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  if (state !== "over" && (invuln <= 0 || Math.floor(invuln * 12) % 2)){
    ctx.fillStyle = "#ffc93c"; ctx.beginPath(); ctx.moveTo(px - 6, P.y + 16); ctx.lineTo(px, P.y + 28 + Math.random() * 6); ctx.lineTo(px + 6, P.y + 16); ctx.fill();
    ctx.fillStyle = "#6f7bff"; ctx.beginPath(); ctx.moveTo(px, P.y - 22); ctx.lineTo(px + 22, P.y + 18); ctx.lineTo(px, P.y + 10); ctx.lineTo(px - 22, P.y + 18); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#eef0ff"; ctx.beginPath(); ctx.arc(px, P.y, 5, 0, 7); ctx.fill();
  }
}

/* Input */
const keys = { l: false, r: false };
const isL = k => k === "ArrowLeft" || k === "a" || k === "A", isR = k => k === "ArrowRight" || k === "d" || k === "D";
function setDir(){ dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0); }
addEventListener("keydown", e => { if (isL(e.key)) keys.l = true; else if (isR(e.key)) keys.r = true; else return; setDir(); e.preventDefault(); });
addEventListener("keyup", e => { if (isL(e.key)) keys.l = false; if (isR(e.key)) keys.r = false; setDir(); });
let dragging = false;
function pointerX(e){ const r = cv.getBoundingClientRect(); target = (e.clientX - r.left) / r.width * W; }
$("stage").addEventListener("pointerdown", e => { if (state === "playing"){ dragging = true; pointerX(e); } });
addEventListener("pointermove", e => { if (dragging) pointerX(e); });
addEventListener("pointerup", () => dragging = false);

document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => startGame(b.dataset.l)));
$("mainBtn").addEventListener("click", () => {
  if (state === "paused"){ state = "playing"; $("msg").hidden = true; last = performance.now(); requestAnimationFrame(loop); }
  else startGame(level);
});
$("altBtn").addEventListener("click", showMenu);
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === "playing"){ state = "paused"; showMsg("Paused", "Your game is waiting.", "Resume"); }
});
reset(); draw();
</script>
</body>
</html>
