<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ping Pong · Free Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4ff;--surface:#fff;--ink:#1a1b3a;--muted:#5b5f85;--line:#dde1f7;--blue:#3b4bff;
  --yellow:#ffc93c;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#14152e;--surface:#1d1f40;--ink:#eef0ff;--muted:#a2a6d0;--line:#2d3060;--blue:#6f7bff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:1rem;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
header,.stats{width:min(100%,440px)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.back{padding:.5rem 1rem;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;box-shadow:inset 0 0 0 2px var(--line);background:var(--surface)}
h1{font:800 1.5rem var(--display);margin:0;letter-spacing:-.02em}
.mute{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:1.2rem;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.stats{display:flex;justify-content:space-between;font-weight:700}
.stats span{background:var(--surface);padding:.35rem .9rem;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line)}
.stage{position:relative;width:min(100%,440px,calc((100dvh - 190px) * 2 / 3));aspect-ratio:2/3;border-radius:24px;overflow:hidden;background:#1d1f40;touch-action:none;box-shadow:0 0 0 3px var(--line);user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:.7rem;text-align:center;padding:1.5rem;background:rgba(20,21,46,.88);color:#eef0ff}
.overlay[hidden]{display:none}
.overlay h2{font:800 2.2rem var(--display);margin:0;letter-spacing:-.02em}
.overlay p{margin:0;color:#c3c7ee;max-width:30ch}
.btn{border:0;border-radius:999px;padding:.85rem 2rem;font:700 1.05rem var(--body);background:var(--yellow);color:#1a1b3a;cursor:pointer}
.btn.ghost{background:transparent;color:#eef0ff;box-shadow:inset 0 0 0 2px #5b5f85}
.picks{display:flex;flex-direction:column;gap:.6rem;width:min(100%,260px);margin-top:.4rem}
.picks .btn{width:100%}.picks small{display:block;font-weight:500;opacity:.75}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&larr; All games</a>
  <h1>Ping Pong</h1>
  <button class="mute" id="mute" aria-label="Mute sound" aria-pressed="false">🔊</button>
</header>
<div class="stats" aria-live="polite">
  <span>You <b id="s1">0</b></span>
  <span>CPU <b id="s2">0</b></span>
  <span>Wins <b id="wins">0</b></span>
</div>
<div class="stage" id="stage">
  <canvas id="c" width="400" height="600" aria-label="Ping Pong game board"></canvas>
  <div class="overlay" id="menu">
    <h2>Ping Pong</h2>
    <p>Bounce the ball past the computer. First to 7 points wins.</p>
    <div class="picks">
      <button class="btn pick" data-l="easy">Easy<small>Slow computer</small></button>
      <button class="btn pick" data-l="medium">Medium<small>A fair match</small></button>
      <button class="btn pick" data-l="hard">Hard<small>Fast, sharp computer</small></button>
    </div>
    <p style="font-size:.9rem">Move with the mouse, your finger, or ← → / A D. Tap, click or press Space to serve.</p>
  </div>
  <div class="overlay" id="msg" hidden>
    <h2 id="mtitle"></h2>
    <p id="mtext"></p>
    <button class="btn" id="mainBtn"></button>
    <button class="btn ghost" id="altBtn">Change level</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $("c"), ctx = cv.getContext("2d"), W = 400, H = 600, PW = 84, PH = 12, R = 8, YP = H - 44, YA = 32, GOAL = 7;
const LEVELS = {
  easy:   { ai: 170, err: 55, ball: 300 },
  medium: { ai: 250, err: 32, ball: 340 },
  hard:   { ai: 340, err: 14, ball: 390 }
};
let level = "medium", cfg = LEVELS.medium, state = "menu";
let ball, px, ax, target, sp, myScore, aiScore, aiErr, trail, last, dir = 0, wins = 0, banner = 0, bannerText = "", serveTo = -1;

/* Audio (synthesized, no files needed) */
let actx = null, muted = false;
try { muted = localStorage.getItem("pong-muted") === "1"; } catch(e) {}
function ac(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(f, d, type = "sine", v = .1, when = 0, to){
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
}
const sfx = {
  hit(){ tone(300 + (sp - cfg.ball) * .5, .06, "square", .08); },
  wall(){ tone(200, .04, "triangle", .06); },
  point(){ tone(660, .1, "square", .06); tone(880, .14, "square", .06, .08); },
  lose(){ tone(220, .3, "sawtooth", .1, 0, 90); },
  win(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .16, "square", .06, i * .09)); },
  over(){ [392, 330, 262, 196].forEach((f, i) => tone(f, .2, "triangle", .11, i * .15)); },
  start(){ [392, 523, 659].forEach((f, i) => tone(f, .1, "square", .05, i * .08)); }
};
function paintMute(){ const b = $("mute"); b.textContent = muted ? "🔇" : "🔊"; b.setAttribute("aria-pressed", muted); b.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound"); }
$("mute").addEventListener("click", () => {
  muted = !muted; paintMute();
  try { localStorage.setItem("pong-muted", muted ? "1" : "0"); } catch(e) {}
  if (!muted) ac();
});
paintMute();

/* Game */
function loadWins(){ try { wins = +localStorage.getItem("pong-wins-" + level) || 0; } catch(e) { wins = 0; } }
function hud(){ $("s1").textContent = myScore; $("s2").textContent = aiScore; $("wins").textContent = wins; }
function resetBall(){ ball = { x: W / 2, y: H / 2, vx: 0, vy: 0 }; sp = cfg.ball; trail = []; aiErr = (Math.random() * 2 - 1) * cfg.err; }
function reset(){ myScore = 0; aiScore = 0; px = W / 2; ax = W / 2; target = W / 2; serveTo = 1; banner = 0; resetBall(); loadWins(); hud(); }
function startGame(l){
  level = l; cfg = LEVELS[l]; reset(); state = "ready";
  $("menu").hidden = true; $("msg").hidden = true; last = performance.now(); ac(); sfx.start(); requestAnimationFrame(loop);
}
function showMsg(t, x, b){ $("mtitle").textContent = t; $("mtext").textContent = x; $("mainBtn").textContent = b; $("msg").hidden = false; $("mainBtn").focus(); }
function showMenu(){ state = "menu"; $("msg").hidden = true; $("menu").hidden = false; reset(); draw(); }
function serve(){
  if (state !== "ready") return;
  const a = (Math.random() - .5) * .9;
  ball.vx = sp * Math.sin(a); ball.vy = serveTo * sp * Math.cos(a); state = "playing"; sfx.hit();
}
function point(toMe){
  if (toMe){ myScore++; sfx.point(); } else { aiScore++; sfx.lose(); }
  hud(); serveTo = toMe ? -1 : 1;
  if (myScore >= GOAL || aiScore >= GOAL){
    state = "over"; const won = myScore >= GOAL;
    if (won){ wins++; try { localStorage.setItem("pong-wins-" + level, wins); } catch(e) {} hud(); }
    setTimeout(won ? sfx.win : sfx.over, 150);
    setTimeout(() => { if (state === "over") showMsg(won ? "You win!" : "CPU wins", "Final score " + myScore + " to " + aiScore + ".", "Play again"); }, 800);
    return;
  }
  banner = 1.1; bannerText = toMe ? "Point for you" : "Point for CPU";
  resetBall(); state = "ready";
}
function stepBall(dt){
  const steps = Math.max(1, Math.ceil(sp * dt / 4)), h = dt / steps;
  for (let s = 0; s < steps; s++){
    ball.x += ball.vx * h; ball.y += ball.vy * h;
    if (ball.x < R){ ball.x = R; ball.vx = Math.abs(ball.vx); sfx.wall(); }
    else if (ball.x > W - R){ ball.x = W - R; ball.vx = -Math.abs(ball.vx); sfx.wall(); }
    // player paddle (bottom)
    if (ball.vy > 0 && ball.y + R >= YP && ball.y + R <= YP + PH + 10 && Math.abs(ball.x - px) <= PW / 2 + R) bounce(px, YP - R, -1);
    // cpu paddle (top)
    else if (ball.vy < 0 && ball.y - R <= YA + PH && ball.y - R >= YA - 10 && Math.abs(ball.x - ax) <= PW / 2 + R){ bounce(ax, YA + PH + R, 1); aiErr = (Math.random() * 2 - 1) * cfg.err; }
    if (ball.y < -R * 2){ point(true); return; }
    if (ball.y > H + R * 2){ point(false); return; }
  }
}
function bounce(cx, y, d){
  const rel = Math.max(-1, Math.min(1, (ball.x - cx) / (PW / 2))), a = rel * 1.0;
  sp = Math.min(sp + 14, cfg.ball * 1.9);
  ball.vx = sp * Math.sin(a); ball.vy = d * sp * Math.cos(a); ball.y = y; sfx.hit();
}
function loop(now){
  if (state !== "ready" && state !== "playing") return;
  const dt = Math.min((now - last) / 1000, .05); last = now;
  target = Math.max(PW / 2, Math.min(W - PW / 2, target + dir * 520 * dt));
  px += (target - px) * Math.min(1, dt * 30);
  if (state === "playing"){
    stepBall(dt);
    if (state === "playing"){
      trail.push({ x: ball.x, y: ball.y }); if (trail.length > 8) trail.shift();
      const want = ball.vy < 0 ? ball.x + aiErr : W / 2, diff = want - ax, mx = cfg.ai * dt;
      ax += Math.max(-mx, Math.min(mx, diff)); ax = Math.max(PW / 2, Math.min(W - PW / 2, ax));
    }
  }
  banner = Math.max(0, banner - dt);
  draw(); requestAnimationFrame(loop);
}
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function draw(){
  ctx.fillStyle = "#1d1f40"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,.12)"; for (let x = 10; x < W; x += 34) ctx.fillRect(x, H / 2 - 2, 18, 4);
  ctx.textAlign = "center"; ctx.font = "800 90px 'Bricolage Grotesque', system-ui, sans-serif"; ctx.fillStyle = "rgba(238,240,255,.08)";
  ctx.fillText(aiScore, W / 2, H / 2 - 40); ctx.fillText(myScore, W / 2, H / 2 + 120);
  ctx.fillStyle = "#ff9a9a"; rr(ax - PW / 2, YA, PW, PH, 6);
  ctx.fillStyle = "#6f7bff"; rr(px - PW / 2, YP, PW, PH, 6);
  trail.forEach((t, i) => { ctx.globalAlpha = i / trail.length * .35; ctx.fillStyle = "#eef0ff"; ctx.beginPath(); ctx.arc(t.x, t.y, R * (i / trail.length), 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1; ctx.fillStyle = "#ffc93c"; ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, 7); ctx.fill();
  if (state === "ready"){ ctx.font = "700 16px 'DM Sans', system-ui, sans-serif"; ctx.fillStyle = "#ffc93c"; ctx.fillText("Tap, click or press Space to serve", W / 2, H / 2 + 50); }
  if (banner > 0){ ctx.globalAlpha = Math.min(banner, 1); ctx.font = "800 26px 'Bricolage Grotesque', system-ui, sans-serif"; ctx.fillStyle = "#eef0ff"; ctx.fillText(bannerText, W / 2, H / 2 - 70); ctx.globalAlpha = 1; }
}

/* Input */
function setTarget(e){ const r = cv.getBoundingClientRect(); target = (e.clientX - r.left) / r.width * W; }
$("stage").addEventListener("pointermove", e => { if (state === "ready" || state === "playing") setTarget(e); });
$("stage").addEventListener("pointerdown", e => { if (state === "ready" || state === "playing") setTarget(e); if (state === "ready") serve(); });
const keys = { l: false, r: false };
const isL = k => k === "ArrowLeft" || k === "a" || k === "A", isR = k => k === "ArrowRight" || k === "d" || k === "D";
function setDir(){ dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0); }
addEventListener("keydown", e => {
  if (isL(e.key)) keys.l = true;
  else if (isR(e.key)) keys.r = true;
  else if ((e.key === " " || e.key === "ArrowUp" || e.key === "Enter") && state === "ready"){ serve(); e.preventDefault(); return; }
  else return;
  setDir(); e.preventDefault();
});
addEventListener("keyup", e => { if (isL(e.key)) keys.l = false; if (isR(e.key)) keys.r = false; setDir(); });
document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => startGame(b.dataset.l)));
let resumeTo = "ready";
$("mainBtn").addEventListener("click", () => {
  if (state === "paused"){ state = resumeTo; $("msg").hidden = true; last = performance.now(); requestAnimationFrame(loop); }
  else startGame(level);
});
$("altBtn").addEventListener("click", showMenu);
document.addEventListener("visibilitychange", () => {
  if (document.hidden && (state === "playing" || state === "ready")){ resumeTo = state; state = "paused"; showMsg("Paused", "Your game is waiting.", "Resume"); }
});
cfg = LEVELS.medium; reset(); draw();
</script>
</body>
</html>
