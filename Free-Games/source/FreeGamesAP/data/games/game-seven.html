<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tic Tac Toe · Free Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4ff;--surface:#fff;--ink:#1a1b3a;--muted:#5b5f85;--line:#dde1f7;--blue:#3b4bff;
  --yellow:#ffc93c;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#14152e;--surface:#1d1f40;--ink:#eef0ff;--muted:#a2a6d0;--line:#2d3060;--blue:#6f7bff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:1rem;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
header,.stats,.status,.stage,.controls{width:min(100%,440px,calc(100dvh - 300px));min-width:min(100%,300px)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.back{padding:.5rem 1rem;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;box-shadow:inset 0 0 0 2px var(--line);background:var(--surface)}
h1{font:800 1.5rem var(--display);margin:0;letter-spacing:-.02em}
.mute{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:1.2rem;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.stats{display:flex;justify-content:space-between;gap:.5rem;font-weight:700}
.stats span{background:var(--surface);padding:.35rem .9rem;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line)}
.status{text-align:center;font:800 1.25rem var(--display);letter-spacing:-.01em;min-height:1.6em}
.stage{position:relative;background:#1d1f40;padding:12px;border-radius:24px;box-shadow:0 0 0 3px var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px;aspect-ratio:1}
.cell{position:relative;min-width:0;min-height:0;overflow:hidden;border:0;padding:0;border-radius:16px;background:#262a58;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.cell:not(:disabled):hover{background:#30356c}
.cell:disabled{cursor:default}
.cell.win{background:#1f4a50;box-shadow:inset 0 0 0 3px #25b896}
.cell svg{position:absolute;inset:19%;width:62%;height:62%;fill:none;stroke-width:12;stroke-linecap:round}
.cell svg path,.cell svg circle{stroke-dasharray:1;stroke-dashoffset:0;animation:draw .3s ease-out}
.cell .x{stroke:#6f7bff}.cell .o{stroke:#ffc93c}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;text-align:center;padding:1.5rem;border-radius:24px;background:rgba(20,21,46,.9);color:#eef0ff}
.overlay[hidden]{display:none}
.overlay h2{font:800 2.2rem var(--display);margin:0;letter-spacing:-.02em}
.overlay p{margin:0;color:#c3c7ee;max-width:30ch}
.btn{border:0;border-radius:999px;padding:.85rem 2rem;font:700 1.05rem var(--body);background:var(--yellow);color:#1a1b3a;cursor:pointer}
.btn.ghost{background:transparent;color:#eef0ff;box-shadow:inset 0 0 0 2px #5b5f85}
.picks{display:flex;flex-direction:column;gap:.55rem;width:min(100%,260px);margin-top:.3rem}
.picks .btn{width:100%;padding:.7rem 2rem}.picks small{display:block;font-weight:500;opacity:.75}
.names-in{width:min(100%,260px);padding:.75rem 1rem;border-radius:999px;border:0;font:500 1rem var(--body);background:#262a58;color:#eef0ff;box-shadow:inset 0 0 0 2px #3a3e78;text-align:center}
.names-in::placeholder{color:#8f94c4}
.names-in:focus{outline:3px solid #6f7bff;outline-offset:2px}
#l1,#l3{display:inline-block;max-width:6.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.controls{display:flex;gap:.5rem}
.soft{flex:1;border:0;cursor:pointer;padding:.65rem;border-radius:999px;background:var(--surface);color:var(--ink);font:500 .95rem var(--body);box-shadow:inset 0 0 0 2px var(--line)}
@media (prefers-reduced-motion:reduce){.cell svg path,.cell svg circle{animation:none}}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&larr; All games</a>
  <h1>Tic Tac Toe</h1>
  <button class="mute" id="mute" aria-label="Mute sound" aria-pressed="false">🔊</button>
</header>
<div class="stats" aria-live="polite">
  <span><span id="l1">You</span> <b id="s1">0</b></span>
  <span>Draws <b id="s2">0</b></span>
  <span><span id="l3">CPU</span> <b id="s3">0</b></span>
</div>
<div class="status" id="status" aria-live="polite">&nbsp;</div>
<div class="stage" id="stage">
  <div class="grid" id="grid"></div>
  <div class="overlay" id="menu">
    <h2>Tic Tac Toe</h2>
    <p>Get three in a row. Choose who you play against.</p>
    <div class="picks">
      <button class="btn pick" data-l="easy">Easy<small>The computer plays randomly</small></button>
      <button class="btn pick" data-l="medium">Medium<small>It blocks and takes wins</small></button>
      <button class="btn pick" data-l="hard">Hard<small>Unbeatable computer</small></button>
      <button class="btn pick ghost" data-l="two">2 Players<small>Take turns on one screen</small></button>
    </div>
  </div>
  <div class="overlay" id="names" hidden>
    <h2>Who&rsquo;s playing?</h2>
    <p>Enter both names. You&rsquo;ll only be asked once.</p>
    <input class="names-in" id="n1" maxlength="12" autocomplete="off" placeholder="Player 1 (X)" aria-label="Player 1 name">
    <input class="names-in" id="n2" maxlength="12" autocomplete="off" placeholder="Player 2 (O)" aria-label="Player 2 name">
    <button class="btn" id="go">Start</button>
    <button class="btn ghost" id="defNames">Just use X and O</button>
    <button class="btn ghost" id="nameBack">Back</button>
  </div>
  <div class="overlay" id="msg" hidden>
    <h2 id="mtitle"></h2>
    <p id="mtext"></p>
    <button class="btn" id="mainBtn">Next round</button>
    <button class="btn ghost" id="altBtn">Change level</button>
  </div>
</div>
<div class="controls">
  <button class="soft" id="restart">Restart round</button>
  <button class="soft" id="change">Change level</button>
</div>

<script>
const $ = id => document.getElementById(id);
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const X_SVG = '<svg viewBox="0 0 100 100" aria-hidden="true"><path class="x" pathLength="1" d="M25 25L75 75M75 25L25 75"/></svg>';
const O_SVG = '<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="o" pathLength="1" cx="50" cy="50" r="28"/></svg>';
let names = null;
const nm = m => names ? names[m] : m;
let mode = "medium", board, turn, starter = "X", state = "menu", stats = { w: 0, d: 0, l: 0 }, cells = [];

/* Audio (synthesized, no files needed) */
let actx = null, muted = false;
try { muted = localStorage.getItem("ttt-muted") === "1"; } catch(e) {}
function ac(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(f, d, type = "sine", v = .1, when = 0, to){
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
}
const sfx = {
  x(){ tone(520, .1, "triangle", .1, 0, 600); },
  o(){ tone(390, .1, "triangle", .1, 0, 440); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, "square", .06, i * .1)); },
  lose(){ [330, 262, 196].forEach((f, i) => tone(f, .22, "triangle", .12, i * .16)); },
  draw(){ tone(330, .2, "triangle", .1); tone(330, .25, "triangle", .1, .22); },
  start(){ [392, 523, 659].forEach((f, i) => tone(f, .1, "square", .05, i * .08)); }
};
function paintMute(){ const b = $("mute"); b.textContent = muted ? "🔇" : "🔊"; b.setAttribute("aria-pressed", muted); b.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound"); }
$("mute").addEventListener("click", () => {
  muted = !muted; paintMute();
  try { localStorage.setItem("ttt-muted", muted ? "1" : "0"); } catch(e) {}
  if (!muted) ac();
});
paintMute();

/* Rules + computer */
const isAI = () => mode !== "two";
function winnerOf(b){ for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { m: b[l[0]], line: l }; return null; }
const full = b => b.every(Boolean);
const empties = b => b.map((v, i) => v ? -1 : i).filter(i => i >= 0);
function findWin(b, m){ for (const i of empties(b)){ b[i] = m; const w = winnerOf(b); b[i] = null; if (w) return i; } return -1; }
function minimax(b, player, depth){
  const w = winnerOf(b); if (w) return w.m === "O" ? 10 - depth : depth - 10;
  if (full(b)) return 0;
  let best = player === "O" ? -99 : 99;
  for (const i of empties(b)){
    b[i] = player; const s = minimax(b, player === "O" ? "X" : "O", depth + 1); b[i] = null;
    best = player === "O" ? Math.max(best, s) : Math.min(best, s);
  }
  return best;
}
const pick = a => a[Math.floor(Math.random() * a.length)];
function aiChoose(){
  const free = empties(board);
  if (mode === "easy") return pick(free);
  if (mode === "medium"){
    let m = findWin(board, "O"); if (m < 0) m = findWin(board, "X");
    if (m >= 0) return m;
    if (!board[4]) return 4;
    return pick(free);
  }
  let bestS = -99, moves = [];
  for (const i of free){
    board[i] = "O"; const s = minimax(board, "X", 1); board[i] = null;
    if (s > bestS){ bestS = s; moves = [i]; } else if (s === bestS) moves.push(i);
  }
  return pick(moves);
}

/* Game */
const key = () => "ttt-stats-" + mode;
function loadStats(){ try { stats = JSON.parse(localStorage.getItem(key())) || { w: 0, d: 0, l: 0 }; } catch(e) { stats = { w: 0, d: 0, l: 0 }; } }
function saveStats(){ try { localStorage.setItem(key(), JSON.stringify(stats)); } catch(e) {} }
function hud(){
  $("l1").textContent = isAI() ? "You" : nm("X"); $("l3").textContent = isAI() ? "CPU" : nm("O");
  $("s1").textContent = stats.w; $("s2").textContent = stats.d; $("s3").textContent = stats.l;
}
function setStatus(){
  if (state !== "play"){ $("status").innerHTML = "&nbsp;"; return; }
  $("status").textContent = isAI() ? (turn === "X" ? "Your turn" : "Computer is thinking…") : (nm(turn) === turn ? turn + "’s turn" : nm(turn) + "’s turn (" + turn + ")");
}
function initCells(){
  const g = $("grid"); g.innerHTML = ""; cells = [];
  for (let i = 0; i < 9; i++){
    const b = document.createElement("button"); b.className = "cell"; b.dataset.i = i;
    b.addEventListener("click", () => humanMove(i)); g.appendChild(b); cells.push(b);
  }
}
function render(){
  cells.forEach((c, i) => {
    const m = board[i];
    if ((c.dataset.m || "") !== (m || "")){ c.innerHTML = m === "X" ? X_SVG : m === "O" ? O_SVG : ""; c.dataset.m = m || ""; }
    c.classList.remove("win");
    c.disabled = !!m || state !== "play" || (isAI() && turn === "O");
    c.setAttribute("aria-label", "Row " + (Math.floor(i / 3) + 1) + ", column " + (i % 3 + 1) + ", " + (m ? m : "empty"));
  });
}
function newRound(){
  board = Array(9).fill(null); turn = starter; state = "play"; $("msg").hidden = true;
  render(); setStatus();
  if (isAI() && turn === "O") aiTurn();
}
function startMode(m){
  mode = m; starter = "X";
  if (m === "two" && !names){ askNames(); return; }
  begin();
}
function askNames(){
  state = "menu"; $("msg").hidden = true; $("menu").hidden = true; $("names").hidden = false;
  $("n1").value = ""; $("n2").value = "";
  board = Array(9).fill(null); render(); setStatus(); $("n1").focus();
}
function begin(){ loadStats(); hud(); $("menu").hidden = true; $("names").hidden = true; ac(); sfx.start(); newRound(); }
function submitNames(useDefault){
  names = useDefault ? { X: "X", O: "O" } : { X: $("n1").value.trim() || "Player 1", O: $("n2").value.trim() || "Player 2" };
  stats = { w: 0, d: 0, l: 0 }; saveStats(); begin();
}
function showMenu(){ state = "menu"; $("msg").hidden = true; $("menu").hidden = false; board = Array(9).fill(null); render(); setStatus(); }
function humanMove(i){ if (state !== "play" || board[i] || (isAI() && turn === "O")) return; ac(); place(i); }
function aiTurn(){ setTimeout(() => { if (state === "play" && turn === "O") place(aiChoose()); }, 500); }
function place(i){
  board[i] = turn; (turn === "X" ? sfx.x : sfx.o)();
  const w = winnerOf(board);
  if (w) return end(w);
  if (full(board)) return end(null);
  turn = turn === "X" ? "O" : "X"; render(); setStatus();
  if (isAI() && turn === "O") aiTurn();
}
function end(w){
  state = "over"; render(); setStatus();
  let title, text = "";
  if (w){
    w.line.forEach(i => cells[i].classList.add("win"));
    if (w.m === "X") stats.w++; else stats.l++;
    if (isAI()){ title = w.m === "X" ? "You win!" : "Computer wins"; setTimeout(w.m === "X" ? sfx.win : sfx.lose, 250); }
    else { title = nm(w.m) + " wins!"; setTimeout(sfx.win, 250); }
  } else { stats.d++; title = "It’s a draw"; setTimeout(sfx.draw, 250); }
  saveStats(); hud();
  starter = starter === "X" ? "O" : "X";
  text = isAI() ? (starter === "X" ? "You go first next round." : "The computer goes first next round.") : (nm(starter) + " goes first next round.");
  setTimeout(() => { if (state === "over"){ $("mtitle").textContent = title; $("mtext").textContent = text; $("msg").hidden = false; $("mainBtn").focus(); } }, w ? 1100 : 700);
}

document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => startMode(b.dataset.l)));
$("go").addEventListener("click", () => submitNames(false));
$("defNames").addEventListener("click", () => submitNames(true));
["n1", "n2"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") submitNames(false); }));
$("nameBack").addEventListener("click", () => { $("names").hidden = true; $("menu").hidden = false; });
$("mainBtn").addEventListener("click", newRound);
$("altBtn").addEventListener("click", showMenu);
$("restart").addEventListener("click", () => {
  if (state === "menu") return;
  if (mode === "two"){ names = null; starter = "X"; askNames(); } else newRound();
});
$("change").addEventListener("click", showMenu);
initCells(); board = Array(9).fill(null); loadStats(); hud(); render();
</script>
</body>
</html>
