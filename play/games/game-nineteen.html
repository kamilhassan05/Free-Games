<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Breaker · Free Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4ff;--surface:#fff;--ink:#1a1b3a;--muted:#5b5f85;--line:#dde1f7;--blue:#3b4bff;
  --yellow:#ffc93c;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#14152e;--surface:#1d1f40;--ink:#eef0ff;--muted:#a2a6d0;--line:#2d3060;--blue:#6f7bff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);padding:max(.8rem,env(safe-area-inset-top)) .8rem max(.8rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:.6rem;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
header,.stats,.status,.stage,.dock{width:min(100%,440px);min-width:min(100%,300px)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.back{padding:.5rem 1rem;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;box-shadow:inset 0 0 0 2px var(--line);background:var(--surface)}
h1{font:800 1.5rem var(--display);margin:0;letter-spacing:-.02em}
.mute{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:1.2rem;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.stats{display:flex;justify-content:space-between;gap:.5rem;font-weight:700}
.stats span{background:var(--surface);padding:.3rem .9rem;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line)}
.status{text-align:center;font:700 1rem var(--body);min-height:1.5em;color:var(--muted)}
.stage{--tries:10;--rh:min(46px,calc((100dvh - 430px) / (var(--tries) + 1)));position:relative;background:#1d1f40;padding:10px;border-radius:24px;box-shadow:0 0 0 3px var(--line);user-select:none;-webkit-user-select:none}
.rows{display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;height:max(var(--rh),30px);padding:0 8px;border-radius:12px}
.row.cur{background:rgba(255,255,255,.07)}
.row.secret{border-bottom:2px dashed #3a3e78;border-radius:0;margin-bottom:4px}
.slots{display:flex;gap:8px;flex:1;justify-content:center}
.slot{height:calc(max(var(--rh),30px) - 8px);aspect-ratio:1;border-radius:50%;background:#262a58;border:0;padding:0;font:800 .75rem var(--body);color:rgba(16,17,42,.65);display:grid;place-items:center}
button.slot{cursor:pointer}
.pegs{display:grid;grid-template-columns:repeat(var(--pc),1fr);gap:3px;width:calc((max(var(--rh),30px) - 6px) * var(--pc) / 2)}
.peg{aspect-ratio:1;border-radius:50%;background:#262a58}
.peg.ex{background:#25b896}.peg.pa{background:#ffc93c}
.dock{display:flex;flex-direction:column;gap:.5rem}
.palette{display:flex;gap:10px;justify-content:center}
.pal{width:46px;height:46px;border:0;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 3px rgba(0,0,0,.15);font:800 .85rem var(--body);color:rgba(16,17,42,.65);touch-action:manipulation}
.pal:active{transform:scale(.92)}
.controls{display:flex;gap:.4rem}
.soft{flex:1;border:0;cursor:pointer;padding:.65rem .3rem;border-radius:999px;background:var(--surface);color:var(--ink);font:500 .9rem var(--body);box-shadow:inset 0 0 0 2px var(--line);white-space:nowrap}
.soft.go{background:var(--yellow);color:#1a1b3a;font-weight:700;box-shadow:none}
.soft:disabled{opacity:.45;cursor:default}
.overlay{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:.6rem;text-align:center;padding:1.25rem;border-radius:24px;background:rgba(20,21,46,.94);color:#eef0ff;z-index:5}
.overlay[hidden]{display:none}
.overlay h2{font:800 2.1rem var(--display);margin:0;letter-spacing:-.02em}
.overlay p{margin:0;color:#c3c7ee;max-width:30ch}
.btn{border:0;border-radius:999px;padding:.8rem 2rem;font:700 1.05rem var(--body);background:var(--yellow);color:#1a1b3a;cursor:pointer}
.btn.ghost{background:transparent;color:#eef0ff;box-shadow:inset 0 0 0 2px #5b5f85}
.picks{display:flex;flex-direction:column;gap:.5rem;width:min(100%,270px);margin-top:.3rem}
.picks .btn{width:100%;padding:.65rem 2rem}.picks small{display:block;font-weight:500;opacity:.75}
.legend{display:flex;gap:1rem;justify-content:center;font-size:.85rem;color:#c3c7ee}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;vertical-align:-1px;margin-right:.3rem}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&larr; All games</a>
  <h1>Code Breaker</h1>
  <button class="mute" id="mute" aria-label="Mute sound" aria-pressed="false">🔊</button>
</header>
<div class="stats">
  <span>Guess <b id="gnum">0</b>/<b id="gmax">10</b></span>
  <span>Best <b id="best">–</b></span>
</div>
<div class="status" id="status" aria-live="polite">&nbsp;</div>
<div class="stage" id="stage">
  <div class="rows" id="rows"></div>
  <div class="overlay" id="menu">
    <h2>Code Breaker</h2>
    <p>Crack the secret color code. After each guess you get clues.</p>
    <div class="legend"><span><i style="background:#25b896"></i>right color, right spot</span><span><i style="background:#ffc93c"></i>right color, wrong spot</span></div>
    <div class="picks">
      <button class="btn pick" data-l="easy">Easy<small>4 slots, 4 colors, no repeats</small></button>
      <button class="btn pick" data-l="medium">Medium<small>4 slots, 6 colors, repeats possible</small></button>
      <button class="btn pick" data-l="hard">Hard<small>5 slots, 6 colors, repeats possible</small></button>
    </div>
  </div>
  <div class="overlay" id="msg" hidden>
    <h2 id="mtitle"></h2>
    <p id="mtext"></p>
    <button class="btn" id="mainBtn">New code</button>
    <button class="btn ghost" id="altBtn">Change level</button>
  </div>
</div>
<div class="dock">
  <div class="palette" id="palette" role="group" aria-label="Colors"></div>
  <div class="controls">
    <button class="soft go" id="submit" disabled>Check ✓</button>
    <button class="soft" id="undo" aria-label="Remove last color">⌫</button>
    <button class="soft" id="hint">💡 Hint</button>
    <button class="soft" id="change">Levels</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const COLORS = [["red", "#ff6b6b", "R"], ["blue", "#6f7bff", "B"], ["green", "#25b896", "G"], ["yellow", "#ffc93c", "Y"], ["purple", "#c4a8ff", "P"], ["orange", "#ff9a5c", "O"]];
const LEVELS = { easy: { L: 4, k: 4, rep: false, tries: 10 }, medium: { L: 4, k: 6, rep: true, tries: 10 }, hard: { L: 5, k: 6, rep: true, tries: 9 } };
let level = "medium", cfg = LEVELS.medium, state = "menu", secret = [], guess = [], history = [], hintUsed = false, best = 0;

/* Audio (synthesized, no files needed) */
let actx = null, muted = false;
try { muted = localStorage.getItem("code-muted") === "1"; } catch(e) {}
function ac(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(f, d, type = "sine", v = .1, when = 0, to){
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
}
const FR = [392, 440, 494, 523, 587, 659];
const sfx = {
  pick(i){ tone(FR[i % 6], .08, "triangle", .1); },
  clear(){ tone(250, .05, "triangle", .06); },
  check(ex, pa){ for (let i = 0; i < ex; i++) tone(700 + i * 90, .08, "square", .05, i * .09); for (let i = 0; i < pa; i++) tone(380, .08, "triangle", .06, (ex + i) * .09); },
  bad(){ tone(180, .15, "sawtooth", .07, 0, 120); },
  hint(){ tone(880, .1, "sine", .06); tone(1175, .12, "sine", .06, .1); },
  win(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .16, "square", .06, i * .09)); },
  lose(){ [330, 262, 220, 165].forEach((f, i) => tone(f, .22, "triangle", .12, i * .16)); },
  start(){ [392, 523, 659].forEach((f, i) => tone(f, .1, "square", .05, i * .08)); }
};
function paintMute(){ const m = $("mute"); m.textContent = muted ? "🔇" : "🔊"; m.setAttribute("aria-pressed", muted); m.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound"); }
$("mute").addEventListener("click", () => {
  muted = !muted; paintMute();
  try { localStorage.setItem("code-muted", muted ? "1" : "0"); } catch(e) {}
  if (!muted) ac();
});
paintMute();

/* Game */
function loadBest(){ try { best = +localStorage.getItem("code-best-" + level) || 0; } catch(e) { best = 0; } $("best").textContent = best || "–"; }
function status(t){ $("status").textContent = t || "\u00a0"; }
function grade(sec, g){
  let ex = 0; const sl = [], gl = [];
  for (let i = 0; i < sec.length; i++){ if (sec[i] === g[i]) ex++; else { sl.push(sec[i]); gl.push(g[i]); } }
  let pa = 0; for (const c of gl){ const j = sl.indexOf(c); if (j >= 0){ pa++; sl.splice(j, 1); } }
  return { ex, pa };
}
function slotEl(c, tag){ const e = document.createElement(tag || "div"); e.className = "slot"; if (c != null){ e.style.background = COLORS[c][1]; e.textContent = COLORS[c][2]; e.setAttribute("aria-label", COLORS[c][0]); } return e; }
function pegs(res){
  const p = document.createElement("div"); p.className = "pegs"; p.style.setProperty("--pc", cfg.L === 5 ? 3 : 2);
  const total = cfg.L === 5 ? 6 : 4;
  for (let i = 0; i < total; i++){ const d = document.createElement("div"); d.className = "peg" + (res ? (i < res.ex ? " ex" : i < res.ex + res.pa ? " pa" : "") : ""); p.appendChild(d); }
  return p;
}
function render(reveal){
  const R = $("rows"); R.innerHTML = ""; $("stage").style.setProperty("--tries", cfg.tries);
  const top = document.createElement("div"); top.className = "row secret"; const ts = document.createElement("div"); ts.className = "slots";
  for (let i = 0; i < cfg.L; i++){ const s = reveal ? slotEl(secret[i]) : slotEl(null); if (!reveal) s.textContent = "?"; ts.appendChild(s); }
  top.appendChild(ts); R.appendChild(top);
  for (let r = 0; r < cfg.tries; r++){
    const row = document.createElement("div"), sl = document.createElement("div"); sl.className = "slots";
    row.className = "row" + (r === history.length && state === "play" ? " cur" : "");
    if (r < history.length){ history[r].g.forEach(c => sl.appendChild(slotEl(c))); row.append(sl, pegs(history[r].res)); }
    else if (r === history.length && state === "play"){
      for (let i = 0; i < cfg.L; i++){ const b = slotEl(guess[i] ?? null, "button"); b.setAttribute("aria-label", guess[i] == null ? "Empty slot " + (i + 1) : "Remove " + COLORS[guess[i]][0]); b.addEventListener("click", () => clearSlot(i)); sl.appendChild(b); }
      row.append(sl, pegs(null));
    } else { for (let i = 0; i < cfg.L; i++) sl.appendChild(slotEl(null)); row.append(sl, pegs(null)); }
    R.appendChild(row);
  }
  $("gnum").textContent = Math.min(history.length + (state === "play" ? 1 : 0), cfg.tries); $("gmax").textContent = cfg.tries;
  $("submit").disabled = !(state === "play" && guess.filter(c => c != null).length === cfg.L);
}
function buildPalette(){
  $("palette").innerHTML = COLORS.slice(0, cfg.k).map((c, i) => '<button class="pal" data-c="' + i + '" style="background:' + c[1] + '" aria-label="' + c[0] + '">' + c[2] + "</button>").join("");
}
function newGame(){
  const pool = COLORS.slice(0, cfg.k).map((_, i) => i); secret = [];
  for (let i = 0; i < cfg.L; i++){ const j = Math.floor(Math.random() * pool.length); secret.push(pool[j]); if (!cfg.rep) pool.splice(j, 1); }
  guess = []; history = []; hintUsed = false; state = "play"; $("hint").disabled = false;
  buildPalette(); loadBest(); status("Pick colors, then press Check"); render(false);
}
function startLevel(l){ level = l; cfg = LEVELS[l]; $("menu").hidden = true; $("msg").hidden = true; ac(); sfx.start(); newGame(); }
function showMenu(){ state = "menu"; $("msg").hidden = true; $("menu").hidden = false; status(""); }
function addColor(c){
  if (state !== "play") return; ac();
  const i = [...Array(cfg.L).keys()].find(k => guess[k] == null); if (i == null) return;
  guess[i] = c; sfx.pick(c); render(false);
}
function clearSlot(i){ if (state !== "play" || guess[i] == null) return; guess[i] = null; sfx.clear(); render(false); }
function undo(){ if (state !== "play") return; for (let i = cfg.L - 1; i >= 0; i--) if (guess[i] != null){ guess[i] = null; sfx.clear(); break; } render(false); }
function check(){
  if (state !== "play" || guess.filter(c => c != null).length !== cfg.L) return;
  const g = guess.slice(), res = grade(secret, g); history.push({ g, res }); guess = []; sfx.check(res.ex, res.pa);
  if (res.ex === cfg.L) return end(true);
  if (history.length >= cfg.tries) return end(false);
  status(res.ex + " right spot, " + res.pa + " wrong spot"); render(false);
}
function end(won){
  state = won ? "won" : "lost"; render(true);
  if (won){
    const n = history.length; if (!best || n < best){ best = n; try { localStorage.setItem("code-best-" + level, n); } catch(e) {} } $("best").textContent = best;
    status("Code cracked!"); setTimeout(sfx.win, 500);
  } else { status("Out of guesses"); setTimeout(sfx.lose, 500); }
  setTimeout(() => {
    $("mtitle").textContent = won ? "You cracked it!" : "Code not cracked";
    $("mtext").textContent = won ? "Solved in " + history.length + (history.length === 1 ? " guess." : " guesses.") + " Best: " + best + "." : "The secret code is shown at the top.";
    $("msg").hidden = false; $("mainBtn").focus();
  }, 1400);
}
function hint(){
  if (state !== "play" || hintUsed) return; ac(); hintUsed = true; $("hint").disabled = true;
  const i = Math.floor(Math.random() * cfg.L); status("Hint: slot " + (i + 1) + " is " + COLORS[secret[i]][0]); sfx.hint();
}

$("palette").addEventListener("click", e => { const b = e.target.closest(".pal"); if (b) addColor(+b.dataset.c); });
$("submit").addEventListener("click", check);
$("undo").addEventListener("click", undo);
$("hint").addEventListener("click", hint);
$("change").addEventListener("click", showMenu);
document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => startLevel(b.dataset.l)));
$("mainBtn").addEventListener("click", () => startLevel(level));
$("altBtn").addEventListener("click", showMenu);
addEventListener("keydown", e => {
  if (state !== "play") return;
  if (e.key === "Enter"){ if (document.activeElement && document.activeElement.tagName === "BUTTON") return; e.preventDefault(); check(); }
  else if (e.key === "Backspace"){ e.preventDefault(); undo(); }
  else { const i = COLORS.findIndex(c => c[2].toLowerCase() === e.key.toLowerCase()); if (i >= 0 && i < cfg.k) addColor(i); }
});
cfg = LEVELS.medium; buildPalette(); loadBest(); render(false);
</script>
</body>
</html>
