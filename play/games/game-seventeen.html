<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Color Clash · Free Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4ff;--surface:#fff;--ink:#1a1b3a;--muted:#5b5f85;--line:#dde1f7;--blue:#3b4bff;
  --yellow:#ffc93c;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#14152e;--surface:#1d1f40;--ink:#eef0ff;--muted:#a2a6d0;--line:#2d3060;--blue:#6f7bff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:1rem;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
header,.stats,.stage{width:min(100%,440px);min-width:min(100%,300px)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.back{padding:.5rem 1rem;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;box-shadow:inset 0 0 0 2px var(--line);background:var(--surface)}
h1{font:800 1.5rem var(--display);margin:0;letter-spacing:-.02em}
.mute{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:1.2rem;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.stats{display:flex;justify-content:space-between;gap:.5rem;font-weight:700}
.stats span{background:var(--surface);padding:.35rem .9rem;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line)}
.stage{position:relative;background:#1d1f40;padding:16px;border-radius:24px;box-shadow:0 0 0 3px var(--line);display:flex;flex-direction:column;gap:14px;user-select:none;-webkit-user-select:none;transition:box-shadow .12s}
.stage.ok{box-shadow:0 0 0 3px #25b896}
.stage.bad{box-shadow:0 0 0 3px #ff6b6b}
.bar{height:10px;border-radius:999px;background:#262a58;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#ffc93c;border-radius:999px;transform-origin:left}
.ask{text-align:center;color:#a2a6d0;font:500 .95rem var(--body);height:1.5em}
.word{height:150px;display:grid;place-items:center;border-radius:18px;background:#262a58;font:800 clamp(2.6rem,15vw,4.4rem) var(--display);letter-spacing:.02em;text-transform:uppercase}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{height:74px;border:0;border-radius:18px;font:800 1.15rem var(--display);cursor:pointer;touch-action:manipulation;color:#10112a}
.ans.yes{background:#25b896}.ans.no{background:#ff9a9a}
.ans:active{transform:scale(.97)}
.ans small{display:block;font:500 .78rem var(--body);opacity:.7}
.streak{text-align:center;height:1.4em;font:700 .95rem var(--body);color:#ffc93c}
.overlay{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:.6rem;text-align:center;padding:1.25rem;border-radius:24px;background:rgba(20,21,46,.94);color:#eef0ff;z-index:5}
.overlay[hidden]{display:none}
.overlay h2{font:800 2.1rem var(--display);margin:0;letter-spacing:-.02em}
.overlay p{margin:0;color:#c3c7ee;max-width:30ch}
.btn{border:0;border-radius:999px;padding:.8rem 2rem;font:700 1.05rem var(--body);background:var(--yellow);color:#1a1b3a;cursor:pointer}
.btn.ghost{background:transparent;color:#eef0ff;box-shadow:inset 0 0 0 2px #5b5f85}
.picks{display:flex;flex-direction:column;gap:.5rem;width:min(100%,260px);margin-top:.3rem}
.picks .btn{width:100%;padding:.65rem 2rem}.picks small{display:block;font-weight:500;opacity:.75}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&larr; All games</a>
  <h1>Color Clash</h1>
  <button class="mute" id="mute" aria-label="Mute sound" aria-pressed="false">🔊</button>
</header>
<div class="stats" aria-live="polite">
  <span>Score <b id="score">0</b></span>
  <span>Best <b id="best">0</b></span>
  <span id="lives" aria-label="Lives">♥♥♥</span>
</div>
<div class="stage" id="stage">
  <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  <div class="ask">Does the <b>color</b> match the <b>word</b>?</div>
  <div class="word" id="word" aria-live="polite">&nbsp;</div>
  <div class="answers">
    <button class="ans yes" id="yes">✓ Match<small>← or Y</small></button>
    <button class="ans no" id="no">✗ No match<small>→ or N</small></button>
  </div>
  <div class="streak" id="streak">&nbsp;</div>
  <div class="overlay" id="menu">
    <h2>Color Clash</h2>
    <p>A color name appears in some ink color. Tap Match if the ink color is the same as the word, or No match if it isn&rsquo;t. Be quick!</p>
    <div class="picks">
      <button class="btn pick" data-l="easy">Easy<small>4 colors, lots of time</small></button>
      <button class="btn pick" data-l="medium">Medium<small>5 colors, faster</small></button>
      <button class="btn pick" data-l="hard">Hard<small>6 colors, very fast</small></button>
    </div>
  </div>
  <div class="overlay" id="msg" hidden>
    <h2 id="mtitle"></h2>
    <p id="mtext"></p>
    <button class="btn" id="mainBtn"></button>
    <button class="btn ghost" id="altBtn">Change level</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const ALL = [["red", "#ff6b6b"], ["blue", "#6f7bff"], ["green", "#25b896"], ["yellow", "#ffc93c"], ["purple", "#c4a8ff"], ["orange", "#ff9a5c"]];
const LEVELS = {
  easy:   { n: 4, start: 3200, min: 2000, lives: 3 },
  medium: { n: 5, start: 2300, min: 1300, lives: 3 },
  hard:   { n: 6, start: 1700, min: 850,  lives: 3 }
};
let level = "medium", cfg = LEVELS.medium, state = "menu", q = null, score = 0, lives = 3, streak = 0, best = 0, qStart = 0, limit = 2000, raf = null, lockUntil = 0, pausedAt = 0;

/* Audio (synthesized, no files needed) */
let actx = null, muted = false;
try { muted = localStorage.getItem("clash-muted") === "1"; } catch(e) {}
function ac(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(f, d, type = "sine", v = .1, when = 0, to){
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
}
const sfx = {
  right(s){ const f = 520 * Math.pow(2, (s % 8) / 12 * 2); tone(f, .09, "square", .06); tone(f * 1.5, .1, "square", .05, .05); },
  wrong(){ tone(180, .3, "sawtooth", .13, 0, 70); },
  over(){ [392, 330, 262, 196].forEach((f, i) => tone(f, .2, "triangle", .11, .2 + i * .14)); },
  start(){ [392, 523, 659].forEach((f, i) => tone(f, .1, "square", .05, i * .08)); }
};
function paintMute(){ const m = $("mute"); m.textContent = muted ? "🔇" : "🔊"; m.setAttribute("aria-pressed", muted); m.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound"); }
$("mute").addEventListener("click", () => {
  muted = !muted; paintMute();
  try { localStorage.setItem("clash-muted", muted ? "1" : "0"); } catch(e) {}
  if (!muted) ac();
});
paintMute();

/* Game */
function loadBest(){ try { best = +localStorage.getItem("clash-best-" + level) || 0; } catch(e) { best = 0; } $("best").textContent = best; }
function hud(){
  $("score").textContent = score; $("lives").textContent = "♥".repeat(Math.max(lives, 0)) + "♡".repeat(cfg.lives - Math.max(lives, 0));
  $("streak").textContent = streak >= 3 ? "Streak " + streak + " 🔥" : "\u00a0";
}
function nextQ(){
  const pool = ALL.slice(0, cfg.n), a = pool[Math.floor(Math.random() * pool.length)];
  const match = Math.random() < .5; let ink = a;
  if (!match){ do { ink = pool[Math.floor(Math.random() * pool.length)]; } while (ink === a); }
  q = { word: a[0], color: ink[1], match };
  const w = $("word"); w.textContent = q.word; w.style.color = q.color; w.setAttribute("aria-label", q.word + " written in " + ink[0]);
  limit = Math.max(cfg.min, cfg.start - score * 25); qStart = performance.now();
}
function startGame(l){
  level = l; cfg = LEVELS[l]; score = 0; lives = cfg.lives; streak = 0; loadBest();
  $("menu").hidden = true; $("msg").hidden = true; state = "play"; ac(); sfx.start(); hud(); nextQ(); lockUntil = performance.now() + 250; tick();
}
function flash(ok){
  const s = $("stage"); s.classList.remove("ok", "bad"); s.classList.add(ok ? "ok" : "bad");
  setTimeout(() => s.classList.remove("ok", "bad"), 180);
}
function answer(isMatch){
  if (state !== "play" || performance.now() < lockUntil) return; ac();
  if (isMatch === q.match){
    streak++; score += 1 + Math.floor(streak / 5); sfx.right(streak); flash(true); hud(); nextQ();
  } else miss();
}
function miss(){
  streak = 0; lives--; sfx.wrong(); flash(false); hud();
  if (lives <= 0) return end();
  nextQ(); lockUntil = performance.now() + 150;
}
function end(){
  state = "over"; cancelAnimationFrame(raf); sfx.over(); $("fill").style.transform = "scaleX(0)";
  const isBest = score > best;
  if (isBest){ best = score; $("best").textContent = best; try { localStorage.setItem("clash-best-" + level, best); } catch(e) {} }
  setTimeout(() => {
    if (state !== "over") return;
    $("mtitle").textContent = "Game over";
    $("mtext").textContent = "You scored " + score + "." + (isBest && score > 0 ? " New best!" : " Best: " + best + ".");
    $("mainBtn").textContent = "Play again"; $("msg").hidden = false; $("mainBtn").focus();
  }, 600);
}
function tick(){
  if (state !== "play") return;
  const left = limit - (performance.now() - qStart);
  $("fill").style.transform = "scaleX(" + Math.max(left / limit, 0) + ")";
  $("fill").style.background = left / limit < .3 ? "#ff6b6b" : "#ffc93c";
  if (left <= 0){ miss(); if (state !== "play") return; }
  raf = requestAnimationFrame(tick);
}
function showMenu(){ state = "menu"; cancelAnimationFrame(raf); $("msg").hidden = true; $("menu").hidden = false; }

/* Input */
$("yes").addEventListener("pointerdown", e => { e.preventDefault(); answer(true); });
$("no").addEventListener("pointerdown", e => { e.preventDefault(); answer(false); });
addEventListener("keydown", e => {
  if (state !== "play") return;
  if (e.key === "ArrowLeft" || e.key === "y" || e.key === "Y"){ e.preventDefault(); answer(true); }
  else if (e.key === "ArrowRight" || e.key === "n" || e.key === "N"){ e.preventDefault(); answer(false); }
});
document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => startGame(b.dataset.l)));
$("mainBtn").addEventListener("click", () => {
  if (state === "paused"){ state = "play"; qStart += performance.now() - pausedAt; $("msg").hidden = true; lockUntil = performance.now() + 200; tick(); }
  else startGame(level);
});
$("altBtn").addEventListener("click", showMenu);
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === "play"){
    state = "paused"; pausedAt = performance.now(); cancelAnimationFrame(raf);
    $("mtitle").textContent = "Paused"; $("mtext").textContent = "Your game is waiting."; $("mainBtn").textContent = "Resume"; $("msg").hidden = false;
  }
});
loadBest(); hud();
</script>
</body>
</html>
