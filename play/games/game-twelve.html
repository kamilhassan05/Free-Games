<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slide Puzzle · Free Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4ff;--surface:#fff;--ink:#1a1b3a;--muted:#5b5f85;--line:#dde1f7;--blue:#3b4bff;
  --yellow:#ffc93c;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#14152e;--surface:#1d1f40;--ink:#eef0ff;--muted:#a2a6d0;--line:#2d3060;--blue:#6f7bff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:1rem;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
header,.stats,.stage,.controls{width:min(100%,440px,calc(100dvh - 270px));min-width:min(100%,300px)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.back{padding:.5rem 1rem;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;box-shadow:inset 0 0 0 2px var(--line);background:var(--surface)}
h1{font:800 1.5rem var(--display);margin:0;letter-spacing:-.02em}
.mute{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:1.2rem;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.stats{display:flex;justify-content:space-between;gap:.5rem;font-weight:700}
.stats span{background:var(--surface);padding:.35rem .9rem;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line)}
.stage{position:relative;background:#1d1f40;padding:10px;border-radius:24px;box-shadow:0 0 0 3px var(--line);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.board{container-type:inline-size;position:relative;aspect-ratio:1;--n:4}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr))}
.cells div{padding:4px}.cells i{display:block;height:100%;border-radius:12px;background:#262a58}
.tiles{position:absolute;inset:0}
.tile{position:absolute;left:0;top:0;width:calc(100% / var(--n));height:calc(100% / var(--n));padding:4px;border:0;background:none;transform:translate(calc(var(--c) * 100%),calc(var(--r) * 100%));transition:transform .14s ease;cursor:pointer}
.t{width:100%;height:100%;display:grid;place-items:center;border-radius:12px;font:800 calc(100cqw / var(--n) * .42) var(--display);color:#10112a;letter-spacing:-.03em}
.tile.ok .t{box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.overlay{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:.7rem;text-align:center;padding:1.5rem;border-radius:24px;background:rgba(20,21,46,.9);color:#eef0ff;z-index:5}
.overlay[hidden]{display:none}
.overlay h2{font:800 2.2rem var(--display);margin:0;letter-spacing:-.02em}
.overlay p{margin:0;color:#c3c7ee;max-width:30ch}
.btn{border:0;border-radius:999px;padding:.85rem 2rem;font:700 1.05rem var(--body);background:var(--yellow);color:#1a1b3a;cursor:pointer}
.btn.ghost{background:transparent;color:#eef0ff;box-shadow:inset 0 0 0 2px #5b5f85}
.picks{display:flex;flex-direction:column;gap:.6rem;width:min(100%,260px);margin-top:.4rem}
.picks .btn{width:100%}.picks small{display:block;font-weight:500;opacity:.75}
.controls{display:flex;gap:.5rem}
.soft{flex:1;border:0;cursor:pointer;padding:.65rem;border-radius:999px;background:var(--surface);color:var(--ink);font:500 .95rem var(--body);box-shadow:inset 0 0 0 2px var(--line)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&larr; All games</a>
  <h1>Slide Puzzle</h1>
  <button class="mute" id="mute" aria-label="Mute sound" aria-pressed="false">🔊</button>
</header>
<div class="stats">
  <span>Moves <b id="moves">0</b></span>
  <span>Time <b id="time">0:00</b></span>
  <span>Best <b id="best">–</b></span>
</div>
<div class="stage" id="stage">
  <div class="board" id="board"><div class="cells" id="cells"></div><div class="tiles" id="tiles"></div></div>
  <div class="overlay" id="menu">
    <h2>Slide Puzzle</h2>
    <p>Slide the tiles into order, from 1 up to the last number.</p>
    <div class="picks">
      <button class="btn pick" data-l="easy">Easy<small>3 × 3 board</small></button>
      <button class="btn pick" data-l="medium">Medium<small>4 × 4 board</small></button>
      <button class="btn pick" data-l="hard">Hard<small>5 × 5 board</small></button>
    </div>
    <p style="font-size:.9rem">Tap a tile next to the gap to slide it. Tapping further along the row or column slides several at once. Arrow keys work too.</p>
  </div>
  <div class="overlay" id="msg" hidden>
    <h2 id="mtitle"></h2>
    <p id="mtext"></p>
    <button class="btn" id="mainBtn">Play again</button>
    <button class="btn ghost" id="altBtn">Change level</button>
  </div>
</div>
<div class="controls">
  <button class="soft" id="restart">New shuffle</button>
  <button class="soft" id="change">Change level</button>
</div>

<script>
const $ = id => document.getElementById(id);
const LEVELS = { easy: 3, medium: 4, hard: 5 };
let level = "medium", n = 4, board = [], els = {}, state = "menu", moves = 0, secs = 0, timer = null, started = false, best = 0;

/* Audio (synthesized, no files needed) */
let actx = null, muted = false;
try { muted = localStorage.getItem("slide-muted") === "1"; } catch(e) {}
function ac(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(f, d, type = "sine", v = .1, when = 0, to){
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
}
const sfx = {
  slide(k){ tone(240 + k * 40, .07, "triangle", .09, 0, 180 + k * 30); },
  place(){ tone(880, .06, "sine", .05); },
  win(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .18, "square", .06, i * .1)); },
  start(){ [392, 523, 659].forEach((f, i) => tone(f, .1, "square", .05, i * .08)); }
};
function paintMute(){ const b = $("mute"); b.textContent = muted ? "🔇" : "🔊"; b.setAttribute("aria-pressed", muted); b.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound"); }
$("mute").addEventListener("click", () => {
  muted = !muted; paintMute();
  try { localStorage.setItem("slide-muted", muted ? "1" : "0"); } catch(e) {}
  if (!muted) ac();
});
paintMute();

/* Board: board[r*n+c] = value (0 = gap); solved when value = index + 1 */
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function loadBest(){ try { best = +localStorage.getItem("slide-best-" + level) || 0; } catch(e) { best = 0; } $("best").textContent = best || "–"; }
function hud(){ $("moves").textContent = moves; $("time").textContent = fmt(secs); }
const gap = () => board.indexOf(0);
const solved = () => board.every((v, i) => v === (i + 1) % (n * n));
function place(v){
  const i = board.indexOf(v), el = els[v]; if (!el) return;
  el.style.setProperty("--r", Math.floor(i / n)); el.style.setProperty("--c", i % n);
  el.classList.toggle("ok", i === v - 1);
}
function build(){
  $("board").style.setProperty("--n", n);
  $("cells").innerHTML = "<div><i></i></div>".repeat(n * n);
  const t = $("tiles"); t.innerHTML = ""; els = {};
  for (let v = 1; v < n * n; v++){
    const b = document.createElement("button"); b.className = "tile"; b.dataset.v = v;
    b.innerHTML = '<div class="t" style="background:hsl(' + (215 + (v / (n * n)) * 150) + ' 70% 68%)">' + v + '</div>';
    b.setAttribute("aria-label", "Tile " + v);
    b.addEventListener("click", () => tapTile(v)); t.appendChild(b); els[v] = b;
  }
}
function shuffle(){
  board = Array.from({ length: n * n }, (_, i) => (i + 1) % (n * n));
  let g = n * n - 1, prev = -1;
  for (let k = 0; k < n * n * 40 || solved(); k++){
    const r = Math.floor(g / n), c = g % n, opts = [];
    if (r > 0) opts.push(g - n); if (r < n - 1) opts.push(g + n);
    if (c > 0) opts.push(g - 1); if (c < n - 1) opts.push(g + 1);
    const ok = opts.filter(o => o !== prev), m = ok[Math.floor(Math.random() * ok.length)];
    board[g] = board[m]; board[m] = 0; prev = g; g = m;
  }
}
function render(){ for (let v = 1; v < n * n; v++) place(v); }
function startGame(l){
  level = l; n = LEVELS[l]; clearInterval(timer); timer = null;
  started = false; moves = 0; secs = 0; build(); shuffle(); render(); loadBest(); hud();
  state = "playing"; $("menu").hidden = true; $("msg").hidden = true; ac(); sfx.start();
}
function slide(i){
  const g = gap(), gr = Math.floor(g / n), gc = g % n, r = Math.floor(i / n), c = i % n;
  if (r !== gr && c !== gc) return false;
  const dist = r === gr ? Math.abs(c - gc) : Math.abs(r - gr); if (!dist) return false;
  const step = r === gr ? (c > gc ? 1 : -1) : (r > gr ? n : -n);
  let cur = g; const moved = [];
  for (let k = 0; k < dist; k++){ const from = cur + step; board[cur] = board[from]; moved.push(board[cur]); cur = from; }
  board[cur] = 0; moved.forEach(place);
  return dist;
}
function tapTile(v){
  if (state !== "playing") return; ac();
  const d = slide(board.indexOf(v)); if (!d) return;
  if (!started){ started = true; timer = setInterval(() => { secs++; hud(); }, 1000); }
  moves++; hud(); sfx.slide(d);
  if (solved()) win();
}
function win(){
  state = "won"; clearInterval(timer);
  const isBest = !best || moves < best;
  if (isBest){ best = moves; $("best").textContent = moves; try { localStorage.setItem("slide-best-" + level, moves); } catch(e) {} }
  setTimeout(sfx.win, 200);
  setTimeout(() => {
    if (state !== "won") return;
    $("mtitle").textContent = "Solved!";
    $("mtext").textContent = moves + " moves in " + fmt(secs) + "." + (isBest ? " New best!" : " Best: " + best + " moves.");
    $("msg").hidden = false; $("mainBtn").focus();
  }, 900);
}
function showMenu(){ state = "menu"; clearInterval(timer); $("msg").hidden = true; $("menu").hidden = false; }

/* Input */
addEventListener("keydown", e => {
  if (state !== "playing") return;
  const g = gap(), r = Math.floor(g / n), c = g % n; let t = -1;
  if (e.key === "ArrowLeft" && c < n - 1) t = g + 1;
  else if (e.key === "ArrowRight" && c > 0) t = g - 1;
  else if (e.key === "ArrowUp" && r < n - 1) t = g + n;
  else if (e.key === "ArrowDown" && r > 0) t = g - n;
  else return;
  e.preventDefault(); tapTile(board[t]);
});
document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => startGame(b.dataset.l)));
$("mainBtn").addEventListener("click", () => startGame(level));
$("altBtn").addEventListener("click", showMenu);
$("restart").addEventListener("click", () => { if (state !== "menu") startGame(level); });
$("change").addEventListener("click", showMenu);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) clearInterval(timer);
  else if (state === "playing" && started){ clearInterval(timer); timer = setInterval(() => { secs++; hud(); }, 1000); }
});
n = LEVELS.medium; build(); shuffle(); render(); loadBest(); hud();
</script>
</body>
</html>
