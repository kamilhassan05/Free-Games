<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pattern Pulse · Free Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4ff;--surface:#fff;--ink:#1a1b3a;--muted:#5b5f85;--line:#dde1f7;--blue:#3b4bff;
  --yellow:#ffc93c;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#14152e;--surface:#1d1f40;--ink:#eef0ff;--muted:#a2a6d0;--line:#2d3060;--blue:#6f7bff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:1rem;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
header,.stats,.status,.stage,.controls{width:min(100%,440px,calc(100dvh - 300px));min-width:min(100%,300px)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.back{padding:.5rem 1rem;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;box-shadow:inset 0 0 0 2px var(--line);background:var(--surface)}
h1{font:800 1.5rem var(--display);margin:0;letter-spacing:-.02em}
.mute{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:1.2rem;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.stats{display:flex;justify-content:space-between;gap:.5rem;font-weight:700}
.stats span{background:var(--surface);padding:.35rem .9rem;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line)}
.status{text-align:center;font:800 1.25rem var(--display);letter-spacing:-.01em;min-height:1.6em}
.stage{position:relative;background:#1d1f40;padding:12px;border-radius:24px;box-shadow:0 0 0 3px var(--line);user-select:none;-webkit-user-select:none}
.pads{--cols:2;--rows:2;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));gap:12px;aspect-ratio:var(--cols)/var(--rows)}
.pad{--c:#ff6b6b;position:relative;border:0;padding:0;min-width:0;min-height:0;border-radius:20px;cursor:pointer;background:color-mix(in srgb,var(--c) 38%,#1d1f40);color:rgba(255,255,255,.55);font:800 1.4rem var(--display);transition:background .08s,box-shadow .08s;touch-action:manipulation}
.pad.lit{background:var(--c);box-shadow:0 0 30px var(--c);color:#1a1b3a}
.pad.locked{cursor:default}
.overlay{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:.7rem;text-align:center;padding:1.5rem;border-radius:24px;background:rgba(20,21,46,.9);color:#eef0ff}
.overlay[hidden]{display:none}
.overlay h2{font:800 2.2rem var(--display);margin:0;letter-spacing:-.02em}
.overlay p{margin:0;color:#c3c7ee;max-width:30ch}
.btn{border:0;border-radius:999px;padding:.85rem 2rem;font:700 1.05rem var(--body);background:var(--yellow);color:#1a1b3a;cursor:pointer}
.btn.ghost{background:transparent;color:#eef0ff;box-shadow:inset 0 0 0 2px #5b5f85}
.songs{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;max-width:300px}
.song{border:0;cursor:pointer;padding:.4rem .85rem;border-radius:999px;background:transparent;color:#eef0ff;font:500 .9rem var(--body);box-shadow:inset 0 0 0 2px #5b5f85}
.song[aria-pressed="true"]{background:#eef0ff;color:#1a1b3a;box-shadow:none}
.picks{display:flex;flex-direction:column;gap:.6rem;width:min(100%,260px);margin-top:.4rem}
.picks .btn{width:100%}.picks small{display:block;font-weight:500;opacity:.75}
.controls{display:flex;gap:.5rem}
.soft{flex:1;border:0;cursor:pointer;padding:.65rem;border-radius:999px;background:var(--surface);color:var(--ink);font:500 .95rem var(--body);box-shadow:inset 0 0 0 2px var(--line)}
@media (prefers-reduced-motion:reduce){.pad{transition:none}}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&larr; All games</a>
  <h1>Pattern Pulse</h1>
  <button class="mute" id="mute" aria-label="Mute sound" aria-pressed="false">🔊</button>
</header>
<div class="stats" aria-live="polite">
  <span>Round <b id="round">0</b></span>
  <span>Best <b id="best">0</b></span>
</div>
<div class="status" id="status" aria-live="polite">&nbsp;</div>
<div class="stage" id="stage">
  <div class="pads" id="pads"></div>
  <div class="overlay" id="menu">
    <h2>Pattern Pulse</h2>
    <p>Repeat the pattern. Every tap plays the next note of the song.</p>
    <div class="songs" id="songs" role="group" aria-label="Song"></div>
    <div class="picks">
      <button class="btn pick" data-l="easy">Easy<small>4 pads, slow</small></button>
      <button class="btn pick" data-l="medium">Medium<small>4 pads, faster</small></button>
      <button class="btn pick" data-l="hard">Hard<small>6 pads, fast</small></button>
    </div>
    <p style="font-size:.9rem">Tap the pads, or press the number keys 1 to 6.</p>
  </div>
  <div class="overlay" id="msg" hidden>
    <h2 id="mtitle"></h2>
    <p id="mtext"></p>
    <button class="btn" id="mainBtn">Play again</button>
    <button class="btn ghost" id="altBtn">Change level</button>
  </div>
</div>
<div class="controls">
  <button class="soft" id="restart">Restart</button>
  <button class="soft" id="change">Change level</button>
</div>

<script>
const $ = id => document.getElementById(id);
const COLORS = ["#ff6b6b", "#ffc93c", "#25b896", "#6f7bff", "#a78bfa", "#ff9a5c"];
const FREQS = [262, 330, 392, 494, 587, 698];
const LEVELS = {
  easy:   { pads: 4, on: 650, gap: 300, beat: 520, cols: 2, rows: 2 },
  medium: { pads: 4, on: 450, gap: 200, beat: 400, cols: 2, rows: 2 },
  hard:   { pads: 6, on: 340, gap: 150, beat: 300, cols: 3, rows: 2 }
};
let startBest = 0, level = "medium", cfg = LEVELS.medium, state = "menu", seq = [], pos = 0, best = 0, timers = [], padEls = [];

/* Audio (synthesized, no files needed) */
let actx = null, muted = false;
try { muted = localStorage.getItem("pulse-muted") === "1"; } catch(e) {}
function ac(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(f, d, type = "sine", v = .1, when = 0, to){
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + .02);
  g.gain.setValueAtTime(v, t0 + Math.max(d - .08, .03)); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
}
const sfx = {
  pad(i, ms){ tone(FREQS[i], ms / 1000, "triangle", .16); },
  ok(){ tone(784, .1, "square", .05); tone(1047, .14, "square", .05, .09); },
  wrong(){ tone(150, .5, "sawtooth", .14, 0, 70); },
  start(){ [392, 523, 659].forEach((f, i) => tone(f, .1, "square", .05, i * .08)); }
};
function paintMute(){ const b = $("mute"); b.textContent = muted ? "🔇" : "🔊"; b.setAttribute("aria-pressed", muted); b.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound"); }
$("mute").addEventListener("click", () => {
  muted = !muted; paintMute();
  try { localStorage.setItem("pulse-muted", muted ? "1" : "0"); } catch(e) {}
  if (!muted) ac();
});
paintMute();


/* Songs: each correct step plays the next note. Format: NOTE:beats
   To add a song, write its notes below (C4 D4 E4 F4 G4 A4 B4 C5 D5 E5 F5 G5; sharps not included). */
const NOTE = { C4:262, D4:294, E4:330, F4:349, G4:392, A4:440, B4:494, C5:523, D5:587, E5:659, F5:698, G5:784 };
const song = str => str.trim().split(/\s+/).map(t => { const [n, b] = t.split(":"); return [NOTE[n], +b || 1]; });
const SONGS = {
  jingle: { name: "Jingle Bells", notes: song(`E4:1 E4:1 E4:2 E4:1 E4:1 E4:2 E4:1 G4:1 C4:1.5 D4:.5 E4:4
    F4:1 F4:1 F4:1.5 F4:.5 F4:1 E4:1 E4:1 E4:.5 E4:.5 E4:1 D4:1 D4:1 E4:1 D4:2 G4:2`) },
  twinkle: { name: "Twinkle Twinkle", notes: song(`C4:1 C4:1 G4:1 G4:1 A4:1 A4:1 G4:2 F4:1 F4:1 E4:1 E4:1 D4:1 D4:1 C4:2
    G4:1 G4:1 F4:1 F4:1 E4:1 E4:1 D4:2 G4:1 G4:1 F4:1 F4:1 E4:1 E4:1 D4:2`) },
  ode: { name: "Ode to Joy", notes: song(`E4:1 E4:1 F4:1 G4:1 G4:1 F4:1 E4:1 D4:1 C4:1 C4:1 D4:1 E4:1 E4:1.5 D4:.5 D4:2
    E4:1 E4:1 F4:1 G4:1 G4:1 F4:1 E4:1 D4:1 C4:1 C4:1 D4:1 E4:1 D4:1.5 C4:.5 C4:2`) },
  classic: { name: "Classic beeps", notes: null }
};
let songId = "jingle";
try { songId = localStorage.getItem("pulse-song") || "jingle"; } catch(e) {}
if (!SONGS[songId]) songId = "jingle";
const noteAt = i => { const n = SONGS[songId].notes; return n ? n[i % n.length] : null; };

/* Game */
const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
function clearTimers(){ timers.forEach(clearTimeout); timers = []; padEls.forEach(p => p.classList.remove("lit")); }
function loadBest(){ try { best = +localStorage.getItem("pulse-best-" + level) || 0; } catch(e) { best = 0; } $("best").textContent = best; }
function status(t){ $("status").textContent = t; }
function buildPads(){
  const box = $("pads"); box.innerHTML = ""; padEls = [];
  box.style.setProperty("--cols", cfg.cols); box.style.setProperty("--rows", cfg.rows);
  for (let i = 0; i < cfg.pads; i++){
    const b = document.createElement("button");
    b.className = "pad locked"; b.style.setProperty("--c", COLORS[i]); b.textContent = i + 1;
    b.setAttribute("aria-label", "Pad " + (i + 1));
    b.addEventListener("pointerdown", e => { e.preventDefault(); press(i); });
    b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); press(i); } });
    box.appendChild(b); padEls.push(b);
  }
}
function lock(on){ padEls.forEach(p => p.classList.toggle("locked", on)); }
function flash(i, ms, step){
  padEls[i].classList.add("lit");
  const n = noteAt(step);
  if (n){ tone(n[0], ms / 1000, "triangle", .15); tone(n[0] * 2, ms / 1400, "sine", .035); } else sfx.pad(i, ms);
  later(() => padEls[i] && padEls[i].classList.remove("lit"), ms);
}
function newGame(l){
  level = l; cfg = LEVELS[l]; clearTimers(); seq = []; pos = 0; buildPads(); loadBest(); startBest = best;
  $("round").textContent = 0; $("menu").hidden = true; $("msg").hidden = true;
  ac(); sfx.start(); state = "show"; lock(true); status("Get ready…");
  later(nextRound, 900);
}
function nextRound(){
  seq.push(Math.floor(Math.random() * cfg.pads)); pos = 0;
  $("round").textContent = seq.length; state = "show"; lock(true); status("Watch carefully");
  const k = Math.max(.6, 1 - seq.length * .02);
  let at = 600;
  seq.forEach((p, i) => {
    const n = noteAt(i), dur = n ? n[1] * cfg.beat * k : (cfg.on + cfg.gap) * k;
    later(() => flash(p, n ? Math.max(dur * .85, 160) : cfg.on * k, i), at); at += dur;
  });
  later(() => { state = "input"; lock(false); status("Your turn"); }, at);
}
function press(i){
  if (state !== "input") return;
  ac();
  const n = noteAt(pos); flash(i, n ? Math.min(Math.max(n[1] * cfg.beat * .85, 180), 650) : 220, pos);
  if (seq[pos] !== i) return fail();
  pos++;
  if (pos === seq.length){
    state = "show"; lock(true); status("Nice!");
    later(sfx.ok, 280);
    const done = seq.length;
    if (done > best){ best = done; $("best").textContent = best; try { localStorage.setItem("pulse-best-" + level, best); } catch(e) {} }
    later(nextRound, 1000);
  }
}
function fail(){
  state = "over"; lock(true); sfx.wrong(); status("Wrong pad");
  padEls.forEach(p => p.classList.add("lit")); later(() => padEls.forEach(p => p.classList.remove("lit")), 350);
  const done = seq.length - 1;
  later(() => {
    $("mtitle").textContent = done > 0 ? "You reached round " + done + "!" : "Game over";
    $("mtext").textContent = "Best: " + best + (done > startBest ? " (new best!)" : "") + ".";
    $("msg").hidden = false; $("mainBtn").focus();
  }, 800);
}
function showMenu(){ clearTimers(); state = "menu"; $("msg").hidden = true; $("menu").hidden = false; status("\u00a0"); }

/* Input */
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest(".pad")) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= cfg.pads && state === "input") press(n - 1);
});
document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => newGame(b.dataset.l)));
$("mainBtn").addEventListener("click", () => newGame(level));
$("altBtn").addEventListener("click", showMenu);
$("restart").addEventListener("click", () => { if (state !== "menu") newGame(level); });
$("change").addEventListener("click", showMenu);
const songsBox = $("songs");
songsBox.innerHTML = Object.entries(SONGS).map(([id, v]) => `<button class="song" data-s="${id}" aria-pressed="${id === songId}">${v.name}</button>`).join("");
songsBox.addEventListener("click", e => {
  const b = e.target.closest(".song"); if (!b) return;
  songId = b.dataset.s; try { localStorage.setItem("pulse-song", songId); } catch(err) {}
  songsBox.querySelectorAll(".song").forEach(x => x.setAttribute("aria-pressed", x === b));
  ac(); const n = noteAt(0); if (n) tone(n[0], .25, "triangle", .15);
});
buildPads(); loadBest(); status("\u00a0");
</script>
</body>
</html>
