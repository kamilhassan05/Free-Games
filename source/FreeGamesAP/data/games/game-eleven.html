<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stack Tower · Free Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4ff;--surface:#fff;--ink:#1a1b3a;--muted:#5b5f85;--line:#dde1f7;--blue:#3b4bff;
  --yellow:#ffc93c;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#14152e;--surface:#1d1f40;--ink:#eef0ff;--muted:#a2a6d0;--line:#2d3060;--blue:#6f7bff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:1rem;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
header,.stats{width:min(100%,440px)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.back{padding:.5rem 1rem;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;box-shadow:inset 0 0 0 2px var(--line);background:var(--surface)}
h1{font:800 1.5rem var(--display);margin:0;letter-spacing:-.02em}
.mute{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:1.2rem;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.stats{display:flex;justify-content:space-between;font-weight:700}
.stats span{background:var(--surface);padding:.35rem .9rem;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line)}
.stage{position:relative;width:min(100%,440px,calc((100dvh - 190px) * 2 / 3));aspect-ratio:2/3;border-radius:24px;overflow:hidden;background:#1d1f40;touch-action:none;box-shadow:0 0 0 3px var(--line);user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:.7rem;text-align:center;padding:1.5rem;background:rgba(20,21,46,.88);color:#eef0ff}
.overlay[hidden]{display:none}
.overlay h2{font:800 2.2rem var(--display);margin:0;letter-spacing:-.02em}
.overlay p{margin:0;color:#c3c7ee;max-width:30ch}
.btn{border:0;border-radius:999px;padding:.85rem 2rem;font:700 1.05rem var(--body);background:var(--yellow);color:#1a1b3a;cursor:pointer}
.btn.ghost{background:transparent;color:#eef0ff;box-shadow:inset 0 0 0 2px #5b5f85}
.picks{display:flex;flex-direction:column;gap:.6rem;width:min(100%,260px);margin-top:.4rem}
.picks .btn{width:100%}.picks small{display:block;font-weight:500;opacity:.75}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&larr; All games</a>
  <h1>Stack Tower</h1>
  <button class="mute" id="mute" aria-label="Mute sound" aria-pressed="false">🔊</button>
</header>
<div class="stats" aria-live="polite">
  <span>Height <b id="score">0</b></span>
  <span>Best <b id="best">0</b></span>
  <span>Perfect <b id="streak">0</b></span>
</div>
<div class="stage" id="stage">
  <canvas id="c" width="400" height="600" aria-label="Stack Tower game board"></canvas>
  <div class="overlay" id="menu">
    <h2>Stack Tower</h2>
    <p>Drop each block on the one below. Any overhang is cut off, so the tower gets thinner.</p>
    <div class="picks">
      <button class="btn pick" data-l="easy">Easy<small>Wide blocks, slow</small></button>
      <button class="btn pick" data-l="medium">Medium<small>Balanced</small></button>
      <button class="btn pick" data-l="hard">Hard<small>Narrow blocks, fast</small></button>
    </div>
    <p style="font-size:.9rem">Tap or click anywhere, or press Space, to drop. Line it up perfectly to keep the block wide.</p>
  </div>
  <div class="overlay" id="msg" hidden>
    <h2 id="mtitle"></h2>
    <p id="mtext"></p>
    <button class="btn" id="mainBtn"></button>
    <button class="btn ghost" id="altBtn">Change level</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $("c"), ctx = cv.getContext("2d"), W = 400, H = 600, BH = 28;
const LEVELS = {
  easy:   { w: 220, speed: 150, accel: 3 },
  medium: { w: 190, speed: 210, accel: 4 },
  hard:   { w: 160, speed: 270, accel: 5 }
};
const color = i => "hsl(" + ((205 + i * 9) % 360) + " 75% 62%)";
let level = "medium", cfg = LEVELS.medium, state = "menu";
let blocks, cur, pieces, pops, camY, streak, score, best = 0, last, hint;

/* Audio (synthesized, no files needed) */
let actx = null, muted = false;
try { muted = localStorage.getItem("stack-muted") === "1"; } catch(e) {}
function ac(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(f, d, type = "sine", v = .1, when = 0, to){
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
}
const PENTA = [0, 2, 4, 7, 9];
const sfx = {
  drop(){ tone(170, .12, "triangle", .14, 0, 90); },
  perfect(s){
    const st = PENTA[s % 5] + 12 * Math.floor(s / 5), f = 440 * Math.pow(2, Math.min(st, 24) / 12);
    tone(f, .25, "triangle", .13); tone(f * 2, .3, "sine", .05, .02);
  },
  over(){ [330, 262, 196, 147].forEach((f, i) => tone(f, .22, "triangle", .12, i * .15)); },
  start(){ [392, 523, 659].forEach((f, i) => tone(f, .1, "square", .05, i * .08)); }
};
function paintMute(){ const b = $("mute"); b.textContent = muted ? "🔇" : "🔊"; b.setAttribute("aria-pressed", muted); b.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound"); }
$("mute").addEventListener("click", () => {
  muted = !muted; paintMute();
  try { localStorage.setItem("stack-muted", muted ? "1" : "0"); } catch(e) {}
  if (!muted) ac();
});
paintMute();

/* Game */
const sy = i => H - 100 - (i + 1) * BH + camY;
function loadBest(){ try { best = +localStorage.getItem("stack-best-" + level) || 0; } catch(e) { best = 0; } $("best").textContent = best; }
function hud(){ $("score").textContent = score; $("streak").textContent = streak; }
function reset(){
  blocks = [{ x: (W - cfg.w) / 2, w: cfg.w, c: color(0) }];
  cur = { x: 0, w: cfg.w, dir: 1, c: color(1) };
  pieces = []; pops = []; camY = 0; streak = 0; score = 0; hint = 3; hud(); loadBest();
}
function startGame(l){
  level = l; cfg = LEVELS[l]; reset(); state = "playing";
  $("menu").hidden = true; $("msg").hidden = true; last = performance.now();
  ac(); sfx.start(); requestAnimationFrame(loop);
}
function showMsg(t, x, b){ $("mtitle").textContent = t; $("mtext").textContent = x; $("mainBtn").textContent = b; $("msg").hidden = false; $("mainBtn").focus(); }
function showMenu(){ state = "menu"; $("msg").hidden = true; $("menu").hidden = false; reset(); draw(); }
function gameOver(){
  state = "over"; sfx.over();
  if (score > best){ best = score; $("best").textContent = best; try { localStorage.setItem("stack-best-" + level, best); } catch(e) {} }
  setTimeout(() => { if (state === "over") showMsg("Tower fell!", "Your tower is " + score + " blocks tall. Best: " + best + ".", "Play again"); }, 800);
  (function fall(){ const n = performance.now(); fall.l = fall.l || n; const dt = Math.min((n - fall.l) / 1000, .05); fall.l = n; step(dt); draw(); if (state === "over") requestAnimationFrame(fall); })();
}
function drop(){
  if (state !== "playing") return; ac();
  const top = blocks[blocks.length - 1], row = blocks.length;
  const left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w), ov = right - left;
  if (ov <= 0){ pieces.push({ x: cur.x, w: cur.w, row, c: cur.c, vy: 0, off: 0 }); return gameOver(); }
  let nx, nw;
  if (Math.abs(cur.x - top.x) <= 5){
    streak++; nx = top.x; nw = cur.w;
    if (streak >= 3 && nw < cfg.w){ const g = Math.min(8, cfg.w - nw); nx -= g / 2; nw += g; nx = Math.max(0, Math.min(W - nw, nx)); }
    sfx.perfect(streak);
    pops.push({ text: streak > 1 ? "Perfect x" + streak : "Perfect!", x: nx + nw / 2, y: sy(row) - 10, life: 1 });
  } else {
    streak = 0; nx = left; nw = ov; sfx.drop();
    if (cur.x < top.x) pieces.push({ x: cur.x, w: left - cur.x, row, c: cur.c, vy: 0, off: 0 });
    else pieces.push({ x: right, w: cur.x + cur.w - right, row, c: cur.c, vy: 0, off: 0 });
  }
  blocks.push({ x: nx, w: nw, c: cur.c }); score++; hint = Math.max(0, hint - 1); hud();
  const fromLeft = score % 2 === 0;
  cur = { x: fromLeft ? 0 : W - nw, w: nw, dir: fromLeft ? 1 : -1, c: color(score + 1) };
}
function step(dt){
  camY += (Math.max(0, (blocks.length - 6) * BH) - camY) * Math.min(1, dt * 6);
  for (let i = pieces.length - 1; i >= 0; i--){
    const p = pieces[i]; p.vy += 1000 * dt; p.off += p.vy * dt; if (sy(p.row) + p.off > H + 60) pieces.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--){ const p = pops[i]; p.y -= 40 * dt; p.life -= dt; if (p.life <= 0) pops.splice(i, 1); }
}
function loop(now){
  if (state !== "playing") return;
  const dt = Math.min((now - last) / 1000, .05); last = now;
  const spd = Math.min(cfg.speed + score * cfg.accel, cfg.speed * 2.2);
  cur.x += cur.dir * spd * dt;
  if (cur.x < 0){ cur.x = 0; cur.dir = 1; } else if (cur.x + cur.w > W){ cur.x = W - cur.w; cur.dir = -1; }
  step(dt); draw(); requestAnimationFrame(loop);
}
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function block(x, y, w, c){
  ctx.fillStyle = c; rr(x, y, w, BH - 2, 5);
  ctx.fillStyle = "rgba(255,255,255,.22)"; rr(x + 3, y + 2, Math.max(w - 6, 0), 5, 3);
}
function draw(){
  ctx.fillStyle = "#1d1f40"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.font = "800 96px 'Bricolage Grotesque', system-ui, sans-serif"; ctx.fillStyle = "rgba(238,240,255,.1)";
  ctx.fillText(score, W / 2, 150);
  ctx.fillStyle = "#14152e"; ctx.fillRect(0, sy(0) + BH - 2, W, H);
  blocks.forEach((b, i) => { const y = sy(i); if (y < H + BH && y > -BH) block(b.x, y, b.w, b.c); });
  if (state === "playing" || state === "paused") block(cur.x, sy(blocks.length), cur.w, cur.c);
  for (const p of pieces) block(p.x, sy(p.row) + p.off, p.w, p.c);
  ctx.font = "800 20px 'Bricolage Grotesque', system-ui, sans-serif"; ctx.fillStyle = "#ffc93c";
  for (const p of pops){ ctx.globalAlpha = Math.min(p.life * 2, 1); ctx.fillText(p.text, p.x, p.y); }
  ctx.globalAlpha = 1;
  if (state === "playing" && hint > 0){ ctx.font = "700 16px 'DM Sans', system-ui, sans-serif"; ctx.fillStyle = "#eef0ff"; ctx.fillText("Tap anywhere to drop the block", W / 2, 70); }
}

/* Input */
$("stage").addEventListener("pointerdown", e => { if (state === "playing"){ e.preventDefault(); drop(); } });
addEventListener("keydown", e => { if ((e.key === " " || e.key === "ArrowDown" || e.key === "Enter") && state === "playing"){ e.preventDefault(); drop(); } });
document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => startGame(b.dataset.l)));
$("mainBtn").addEventListener("click", () => {
  if (state === "paused"){ state = "playing"; $("msg").hidden = true; last = performance.now(); requestAnimationFrame(loop); }
  else startGame(level);
});
$("altBtn").addEventListener("click", showMenu);
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === "playing"){ state = "paused"; showMsg("Paused", "Your tower is waiting.", "Resume"); }
});
reset(); draw();
</script>
</body>
</html>
