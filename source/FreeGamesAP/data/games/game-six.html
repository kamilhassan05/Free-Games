<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brick Breaker · Free Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4ff;--surface:#fff;--ink:#1a1b3a;--muted:#5b5f85;--line:#dde1f7;--blue:#3b4bff;
  --yellow:#ffc93c;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#14152e;--surface:#1d1f40;--ink:#eef0ff;--muted:#a2a6d0;--line:#2d3060;--blue:#6f7bff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:1rem;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
header,.stats{width:min(100%,440px)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.back{padding:.5rem 1rem;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;box-shadow:inset 0 0 0 2px var(--line);background:var(--surface)}
h1{font:800 1.5rem var(--display);margin:0;letter-spacing:-.02em}
.mute{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:1.2rem;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.stats{display:flex;justify-content:space-between;font-weight:700}
.stats span{background:var(--surface);padding:.35rem .9rem;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line)}
.stage{position:relative;width:min(100%,440px,calc((100dvh - 190px) * 2 / 3));aspect-ratio:2/3;border-radius:24px;overflow:hidden;background:#1d1f40;touch-action:none;box-shadow:0 0 0 3px var(--line)}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;text-align:center;padding:1.5rem;background:rgba(20,21,46,.88);color:#eef0ff}
.overlay[hidden]{display:none}
.overlay h2{font:800 2.2rem var(--display);margin:0;letter-spacing:-.02em}
.overlay p{margin:0;color:#c3c7ee;max-width:30ch}
.btn{border:0;border-radius:999px;padding:.85rem 2rem;font:700 1.05rem var(--body);background:var(--yellow);color:#1a1b3a;cursor:pointer}
.btn.ghost{background:transparent;color:#eef0ff;box-shadow:inset 0 0 0 2px #5b5f85}
.picks{display:flex;flex-direction:column;gap:.6rem;width:min(100%,260px);margin-top:.4rem}
.picks .btn{width:100%}
.picks small{display:block;font-weight:500;opacity:.75}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&larr; All games</a>
  <h1>Brick Breaker</h1>
  <button class="mute" id="mute" aria-label="Mute sound" aria-pressed="false">🔊</button>
</header>
<div class="stats" aria-live="polite">
  <span>Score <b id="score">0</b></span>
  <span>Best <b id="best">0</b></span>
  <span id="lives" aria-label="Lives">♥♥♥</span>
</div>
<div class="stage" id="stage">
  <canvas id="c" width="400" height="600" aria-label="Brick Breaker game board"></canvas>
  <div class="overlay" id="menu">
    <h2>Brick Breaker</h2>
    <p>Bounce the ball to smash every brick. Don&rsquo;t let it fall.</p>
    <div class="picks">
      <button class="btn pick" data-l="easy">Easy<small>5 lives, wide paddle</small></button>
      <button class="btn pick" data-l="medium">Medium<small>3 lives</small></button>
      <button class="btn pick" data-l="hard">Hard<small>3 lives, fast ball, small paddle</small></button>
    </div>
    <p style="font-size:.9rem">Move with the mouse, your finger, or ← → / A D. Tap, click or press Space to launch the ball.</p>
  </div>
  <div class="overlay" id="msg" hidden>
    <h2 id="mtitle"></h2>
    <p id="mtext"></p>
    <button class="btn" id="mainBtn"></button>
    <button class="btn ghost" id="altBtn">Change level</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $("c"), ctx = cv.getContext("2d"), W = 400, H = 600;
const LEVELS = {
  easy:   { lives: 5, speed: 320, pw: 92, rows: 4 },
  medium: { lives: 3, speed: 370, pw: 78, rows: 5 },
  hard:   { lives: 3, speed: 430, pw: 64, rows: 6 }
};
const COLORS = ["#ff6b6b", "#ff9a5c", "#ffc93c", "#25b896", "#6f7bff", "#a78bfa", "#ff4f7b", "#4fd3b3"];
const COLS = 8, GAP = 6, MX = 16, TOP = 64, BH = 20, BW = (W - MX * 2 - GAP * (COLS - 1)) / COLS;
const PY = H - 56, PH = 14, R = 7;
let level = "medium", cfg = LEVELS.medium, state = "menu";
let score, lives, stage, spd, ball, px, target, pw, bricks, parts, last, dir = 0, best = 0, banner = 0, bannerText = "", rows;

/* Audio (synthesized, no files needed) */
let actx = null, muted = false;
try { muted = localStorage.getItem("bricks-muted") === "1"; } catch(e) {}
function ac(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(f, d, type = "sine", v = .1, when = 0, to){
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
}
const sfx = {
  wall(){ tone(380, .05, "triangle", .06); },
  paddle(){ tone(240, .08, "triangle", .1, 0, 180); },
  brick(row){ tone(420 + (rows - row) * 55, .1, "square", .06); },
  crack(){ tone(300, .06, "square", .05); },
  launch(){ tone(500, .1, "triangle", .06, 0, 800); },
  lose(){ tone(300, .4, "sawtooth", .12, 0, 70); },
  clear(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, "square", .06, i * .1)); },
  over(){ [392, 330, 262, 196].forEach((f, i) => tone(f, .22, "triangle", .12, i * .16)); },
  start(){ [330, 440, 554].forEach((f, i) => tone(f, .1, "square", .05, i * .08)); }
};
function paintMute(){ const b = $("mute"); b.textContent = muted ? "🔇" : "🔊"; b.setAttribute("aria-pressed", muted); b.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound"); }
$("mute").addEventListener("click", () => {
  muted = !muted; paintMute();
  try { localStorage.setItem("bricks-muted", muted ? "1" : "0"); } catch(e) {}
  if (!muted) ac();
});
paintMute();

/* Game */
function loadBest(){ try { best = +localStorage.getItem("bricks-best-" + level) || 0; } catch(e) { best = 0; } $("best").textContent = best; }
function hud(){ $("score").textContent = score; $("lives").textContent = "♥".repeat(Math.max(lives, 0)) + "♡".repeat(Math.max(cfg.lives - lives, 0)); }
function buildBricks(){
  rows = Math.min(cfg.rows + Math.floor((stage - 1) / 2), 8); bricks = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++)
    bricks.push({ x: MX + c * (BW + GAP), y: TOP + r * (BH + GAP), row: r, hp: stage >= 2 && r < 2 ? 2 : 1, alive: true });
}
function resetBall(){ ball = { x: px, y: PY - R - 1, vx: 0, vy: 0 }; }
function reset(){
  score = 0; lives = cfg.lives; stage = 1; spd = cfg.speed; pw = cfg.pw; px = W / 2; target = W / 2;
  parts = []; banner = 0; buildBricks(); resetBall(); hud(); loadBest();
}
function startGame(l){
  level = l; cfg = LEVELS[l]; reset(); state = "ready";
  $("menu").hidden = true; $("msg").hidden = true; last = performance.now();
  ac(); sfx.start(); requestAnimationFrame(loop);
}
function showMsg(title, text, main){
  $("mtitle").textContent = title; $("mtext").textContent = text; $("mainBtn").textContent = main;
  $("msg").hidden = false; $("mainBtn").focus();
}
function showMenu(){ state = "menu"; $("msg").hidden = true; $("menu").hidden = false; reset(); draw(); }
function launch(){
  if (state !== "ready") return;
  const a = (Math.random() - .5) * .7;
  ball.vx = spd * Math.sin(a); ball.vy = -spd * Math.cos(a); state = "playing"; sfx.launch();
}
function gameOver(){
  state = "over"; sfx.over();
  if (score > best){ best = score; $("best").textContent = best; try { localStorage.setItem("bricks-best-" + level, best); } catch(e) {} }
  draw(); showMsg("Game over", "You scored " + score + " and reached stage " + stage + ". Best: " + best + ".", "Play again");
}
function burst(x, y, col){
  for (let i = 0; i < 10; i++){
    const a = Math.random() * 6.28, s = 50 + Math.random() * 140;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .4 + Math.random() * .3, col });
  }
}
function norm(){ const m = Math.hypot(ball.vx, ball.vy) || 1; ball.vx *= spd / m; ball.vy *= spd / m; }
function stepBall(dt){
  const steps = Math.max(1, Math.ceil(spd * dt / 4)), h = dt / steps;
  for (let s = 0; s < steps; s++){
    ball.x += ball.vx * h; ball.y += ball.vy * h;
    if (ball.x < R){ ball.x = R; ball.vx = Math.abs(ball.vx); sfx.wall(); }
    else if (ball.x > W - R){ ball.x = W - R; ball.vx = -Math.abs(ball.vx); sfx.wall(); }
    if (ball.y < R){ ball.y = R; ball.vy = Math.abs(ball.vy); sfx.wall(); }
    if (ball.vy > 0 && ball.y + R >= PY && ball.y + R <= PY + PH + 8 && Math.abs(ball.x - px) <= pw / 2 + R){
      const rel = Math.max(-1, Math.min(1, (ball.x - px) / (pw / 2))), a = rel * 1.05;
      spd = Math.min(spd + 3, cfg.speed * 1.7);
      ball.vx = spd * Math.sin(a); ball.vy = -spd * Math.cos(a); ball.y = PY - R; sfx.paddle();
    }
    for (const b of bricks){
      if (!b.alive) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + BW)), cy = Math.max(b.y, Math.min(ball.y, b.y + BH));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy >= R * R) continue;
      if (dx === 0 && dy === 0) ball.vy = -ball.vy;
      else if (Math.abs(dx) > Math.abs(dy)){ ball.x += Math.sign(dx) * (R - Math.abs(dx)); ball.vx = Math.abs(ball.vx) * Math.sign(dx); }
      else { ball.y += Math.sign(dy) * (R - Math.abs(dy)); ball.vy = Math.abs(ball.vy) * Math.sign(dy); }
      b.hp--;
      if (b.hp <= 0){ b.alive = false; score += 10 + (rows - 1 - b.row) * 5; burst(b.x + BW / 2, b.y + BH / 2, COLORS[b.row]); sfx.brick(b.row); hud(); }
      else sfx.crack();
      break;
    }
  }
}
function loop(now){
  if (state !== "ready" && state !== "playing") return;
  const dt = Math.min((now - last) / 1000, .05); last = now;
  target = Math.max(pw / 2, Math.min(W - pw / 2, target + dir * 520 * dt));
  px += (target - px) * Math.min(1, dt * 30);
  if (state === "ready"){ ball.x = px; ball.y = PY - R - 1; }
  else {
    stepBall(dt);
    if (ball.y > H + 20){
      lives--; hud(); sfx.lose();
      if (lives <= 0){ gameOver(); return; }
      resetBall(); state = "ready";
    } else if (!bricks.some(b => b.alive)){
      stage++; spd = Math.min(cfg.speed * (1 + stage * .05), cfg.speed * 1.5); buildBricks(); resetBall(); state = "ready";
      sfx.clear(); banner = 1.6; bannerText = "Stage " + stage;
    }
  }
  for (let i = parts.length - 1; i >= 0; i--){ const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.life <= 0) parts.splice(i, 1); }
  banner = Math.max(0, banner - dt);
  draw(); requestAnimationFrame(loop);
}
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function draw(){
  ctx.fillStyle = "#1d1f40"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "left"; ctx.font = "700 14px 'DM Sans', system-ui, sans-serif"; ctx.fillStyle = "rgba(238,240,255,.55)";
  ctx.fillText("Stage " + stage, 16, 30);
  for (const b of bricks){
    if (!b.alive) continue;
    ctx.fillStyle = COLORS[b.row]; rr(b.x, b.y, BW, BH, 6);
    if (b.hp > 1){ ctx.fillStyle = "rgba(255,255,255,.45)"; rr(b.x + 5, b.y + 5, BW - 10, BH - 10, 3); }
  }
  ctx.fillStyle = "#6f7bff"; rr(px - pw / 2, PY, pw, PH, 7);
  ctx.fillStyle = "#ffc93c"; rr(px - pw / 2 + 8, PY + 4, pw - 16, 4, 2);
  ctx.fillStyle = "#eef0ff"; ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, 7); ctx.fill();
  for (const p of parts){ ctx.globalAlpha = Math.max(p.life * 2, 0); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1; ctx.textAlign = "center";
  if (state === "ready"){ ctx.font = "700 16px 'DM Sans', system-ui, sans-serif"; ctx.fillStyle = "#ffc93c"; ctx.fillText("Tap, click or press Space to launch", W / 2, PY - 60); }
  if (banner > 0){ ctx.globalAlpha = Math.min(banner, 1); ctx.font = "800 36px 'Bricolage Grotesque', system-ui, sans-serif"; ctx.fillStyle = "#eef0ff"; ctx.fillText(bannerText, W / 2, H / 2); ctx.globalAlpha = 1; }
}

/* Input */
function setTarget(e){ const r = cv.getBoundingClientRect(); target = (e.clientX - r.left) / r.width * W; }
$("stage").addEventListener("pointermove", e => { if (state === "ready" || state === "playing") setTarget(e); });
$("stage").addEventListener("pointerdown", e => {
  if (state === "ready" || state === "playing") setTarget(e);
  if (state === "ready") launch();
});
const keys = { l: false, r: false };
const isL = k => k === "ArrowLeft" || k === "a" || k === "A", isR = k => k === "ArrowRight" || k === "d" || k === "D";
function setDir(){ dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0); }
addEventListener("keydown", e => {
  if (isL(e.key)) keys.l = true;
  else if (isR(e.key)) keys.r = true;
  else if ((e.key === " " || e.key === "ArrowUp" || e.key === "Enter") && state === "ready"){ launch(); e.preventDefault(); return; }
  else return;
  setDir(); e.preventDefault();
});
addEventListener("keyup", e => { if (isL(e.key)) keys.l = false; if (isR(e.key)) keys.r = false; setDir(); });
document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => startGame(b.dataset.l)));
let resumeTo = "ready";
$("mainBtn").addEventListener("click", () => {
  if (state === "paused"){ state = resumeTo; $("msg").hidden = true; last = performance.now(); requestAnimationFrame(loop); }
  else startGame(level);
});
$("altBtn").addEventListener("click", showMenu);
document.addEventListener("visibilitychange", () => {
  if (document.hidden && (state === "playing" || state === "ready")){
    resumeTo = state; state = "paused"; showMsg("Paused", "Your game is waiting.", "Resume");
  }
});
reset(); draw();
</script>
</body>
</html>
