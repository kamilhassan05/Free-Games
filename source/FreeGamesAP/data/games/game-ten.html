<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mine Sweeper · Free Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4ff;--surface:#fff;--ink:#1a1b3a;--muted:#5b5f85;--line:#dde1f7;--blue:#3b4bff;
  --yellow:#ffc93c;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#14152e;--surface:#1d1f40;--ink:#eef0ff;--muted:#a2a6d0;--line:#2d3060;--blue:#6f7bff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:1rem;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
header,.stats,.stage,.controls{width:min(100%,440px,calc(100dvh - 270px));min-width:min(100%,300px)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.back{padding:.5rem 1rem;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;box-shadow:inset 0 0 0 2px var(--line);background:var(--surface)}
h1{font:800 1.5rem var(--display);margin:0;letter-spacing:-.02em}
.mute{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:1.2rem;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.stats{display:flex;justify-content:space-between;gap:.5rem;font-weight:700}
.stats span{background:var(--surface);padding:.35rem .9rem;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line)}
.stage{position:relative;background:#1d1f40;padding:10px;border-radius:24px;box-shadow:0 0 0 3px var(--line);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.grid{container-type:inline-size;--n:9;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));gap:3px;aspect-ratio:1}
.cell{min-width:0;min-height:0;padding:0;border:0;border-radius:6px;background:#3d4388;color:#eef0ff;cursor:pointer;display:grid;place-items:center;overflow:hidden;font:800 calc(100cqw / var(--n) * .5) var(--display);line-height:1}
.cell:not(.rev):hover{background:#4a51a0}
.cell.rev{background:#262a58;cursor:default}
.cell.mine{background:#ff6b6b}
.cell.hit{background:#ff3d5a}
.cell[data-n="1"]{color:#8f9bff}.cell[data-n="2"]{color:#25b896}.cell[data-n="3"]{color:#ff6b6b}.cell[data-n="4"]{color:#a78bfa}
.cell[data-n="5"]{color:#ff9a5c}.cell[data-n="6"]{color:#4fd3b3}.cell[data-n="7"]{color:#ffc93c}.cell[data-n="8"]{color:#eef0ff}
.overlay{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:.7rem;text-align:center;padding:1.5rem;border-radius:24px;background:rgba(20,21,46,.9);color:#eef0ff;z-index:5}
.overlay[hidden]{display:none}
.overlay h2{font:800 2.2rem var(--display);margin:0;letter-spacing:-.02em}
.overlay p{margin:0;color:#c3c7ee;max-width:30ch}
.btn{border:0;border-radius:999px;padding:.85rem 2rem;font:700 1.05rem var(--body);background:var(--yellow);color:#1a1b3a;cursor:pointer}
.btn.ghost{background:transparent;color:#eef0ff;box-shadow:inset 0 0 0 2px #5b5f85}
.picks{display:flex;flex-direction:column;gap:.6rem;width:min(100%,260px);margin-top:.4rem}
.picks .btn{width:100%}.picks small{display:block;font-weight:500;opacity:.75}
.controls{display:flex;gap:.5rem}
.soft{flex:1;border:0;cursor:pointer;padding:.65rem .5rem;border-radius:999px;background:var(--surface);color:var(--ink);font:500 .95rem var(--body);box-shadow:inset 0 0 0 2px var(--line)}
.soft.on{background:var(--ink);color:var(--bg);box-shadow:none}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&larr; All games</a>
  <h1>Mine Sweeper</h1>
  <button class="mute" id="mute" aria-label="Mute sound" aria-pressed="false">🔊</button>
</header>
<div class="stats">
  <span>💣 <b id="left">0</b></span>
  <span>Time <b id="time">0</b>s</span>
  <span>Best <b id="best">–</b></span>
</div>
<div class="stage" id="stage">
  <div class="grid" id="grid"></div>
  <div class="overlay" id="menu">
    <h2>Mine Sweeper</h2>
    <p>Uncover every safe square. Numbers show how many mines touch a square.</p>
    <div class="picks">
      <button class="btn pick" data-l="easy">Easy<small>8 × 8, 10 mines</small></button>
      <button class="btn pick" data-l="medium">Medium<small>10 × 10, 18 mines</small></button>
      <button class="btn pick" data-l="hard">Hard<small>12 × 12, 32 mines</small></button>
    </div>
    <p style="font-size:.9rem">Tap to dig. Touch and hold (or right-click) to place a flag. Your first tap is always safe.</p>
  </div>
  <div class="overlay" id="msg" hidden>
    <h2 id="mtitle"></h2>
    <p id="mtext"></p>
    <button class="btn" id="mainBtn">Play again</button>
    <button class="btn ghost" id="altBtn">Change level</button>
  </div>
</div>
<div class="controls">
  <button class="soft" id="mode" aria-pressed="false">⛏️ Dig</button>
  <button class="soft" id="restart">Restart</button>
  <button class="soft" id="change">Change level</button>
</div>

<script>
const $ = id => document.getElementById(id);
const LEVELS = { easy: { n: 8, mines: 10 }, medium: { n: 10, mines: 18 }, hard: { n: 12, mines: 32 } };
let level = "medium", N = 10, MINES = 18, state = "menu", cells = [], els = [], started = false, flagMode = false;
let secs = 0, timer = null, revealed = 0, flags = 0, best = 0;

/* Audio (synthesized, no files needed) */
let actx = null, muted = false;
try { muted = localStorage.getItem("mines-muted") === "1"; } catch(e) {}
function ac(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(f, d, type = "sine", v = .1, when = 0, to){
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
}
const sfx = {
  dig(){ tone(420, .05, "triangle", .08); },
  open(){ tone(300, .18, "triangle", .07, 0, 700); },
  flag(){ tone(620, .06, "square", .05); tone(820, .06, "square", .05, .05); },
  unflag(){ tone(520, .06, "square", .04); },
  boom(){ tone(150, .6, "sawtooth", .18, 0, 35); tone(80, .5, "square", .1, 0, 30); },
  win(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .18, "square", .06, i * .1)); },
  start(){ [392, 523, 659].forEach((f, i) => tone(f, .1, "square", .05, i * .08)); }
};
function paintMute(){ const b = $("mute"); b.textContent = muted ? "🔇" : "🔊"; b.setAttribute("aria-pressed", muted); b.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound"); }
$("mute").addEventListener("click", () => {
  muted = !muted; paintMute();
  try { localStorage.setItem("mines-muted", muted ? "1" : "0"); } catch(e) {}
  if (!muted) ac();
});
paintMute();

/* Board */
function loadBest(){ try { best = +localStorage.getItem("mines-best-" + level) || 0; } catch(e) { best = 0; } $("best").textContent = best ? best + "s" : "–"; }
function hud(){ $("left").textContent = MINES - flags; $("time").textContent = secs; }
const nbrs = i => {
  const r = Math.floor(i / N), c = i % N, out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++){
    if (!dr && !dc) continue; const rr = r + dr, cc = c + dc;
    if (rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(rr * N + cc);
  }
  return out;
};
function paint(i){
  const c = cells[i], el = els[i];
  el.className = "cell" + (c.rev ? " rev" : "") + (c.show === "mine" ? " mine" : "") + (c.show === "hit" ? " hit" : "");
  el.removeAttribute("data-n");
  let t = "", label = "Unrevealed";
  if (c.rev && !c.mine){ if (c.n){ t = c.n; el.dataset.n = c.n; } label = c.n ? c.n + " nearby" : "Empty"; }
  else if (c.show === "mine" || c.show === "hit"){ t = "💣"; label = "Mine"; }
  else if (c.show === "wrong"){ t = "❌"; label = "Wrong flag"; }
  else if (c.flag){ t = "🚩"; label = "Flagged"; }
  el.textContent = t; el.setAttribute("aria-label", "Row " + (Math.floor(i / N) + 1) + ", column " + (i % N + 1) + ", " + label);
}
function build(){
  const g = $("grid"); g.innerHTML = ""; g.style.setProperty("--n", N); cells = []; els = [];
  for (let i = 0; i < N * N; i++){
    cells.push({ mine: false, rev: false, flag: false, n: 0, show: "" });
    const b = document.createElement("button"); b.className = "cell"; b.dataset.i = i; g.appendChild(b); els.push(b); paint(i);
  }
}
function startGame(l){
  level = l; N = LEVELS[l].n; MINES = LEVELS[l].mines; clearInterval(timer); timer = null;
  started = false; revealed = 0; flags = 0; secs = 0; flagMode = false; setMode();
  build(); loadBest(); hud(); state = "playing";
  $("menu").hidden = true; $("msg").hidden = true; ac(); sfx.start();
}
function placeMines(safe){
  const ban = new Set([safe, ...nbrs(safe)]), pool = [];
  for (let i = 0; i < N * N; i++) if (!ban.has(i)) pool.push(i);
  for (let k = 0; k < MINES; k++){ const j = k + Math.floor(Math.random() * (pool.length - k)); [pool[k], pool[j]] = [pool[j], pool[k]]; cells[pool[k]].mine = true; }
  cells.forEach((c, i) => { c.n = nbrs(i).filter(j => cells[j].mine).length; });
}
function startTimer(){ clearInterval(timer); timer = setInterval(() => { secs++; hud(); }, 1000); }
function dig(i){
  const c = cells[i]; if (state !== "playing" || c.flag) return;
  if (c.rev){ return chord(i); }
  if (!started){ started = true; placeMines(i); startTimer(); }
  if (c.mine){ c.show = "hit"; return lose(); }
  const before = revealed, stack = [i];
  while (stack.length){
    const k = stack.pop(), q = cells[k]; if (q.rev || q.flag) continue;
    q.rev = true; revealed++; paint(k);
    if (q.n === 0) nbrs(k).forEach(j => { if (!cells[j].rev) stack.push(j); });
  }
  (revealed - before > 1 ? sfx.open : sfx.dig)();
  if (revealed === N * N - MINES) win();
}
function chord(i){
  const c = cells[i]; if (!c.n) return;
  const ns = nbrs(i); if (ns.filter(j => cells[j].flag).length !== c.n) return;
  for (const j of ns){ if (state !== "playing") break; if (!cells[j].flag && !cells[j].rev) dig(j); }
}
function toggleFlag(i){
  const c = cells[i]; if (state !== "playing" || c.rev) return;
  c.flag = !c.flag; flags += c.flag ? 1 : -1; c.flag ? sfx.flag() : sfx.unflag(); paint(i); hud();
}
function lose(){
  state = "over"; clearInterval(timer); sfx.boom();
  cells.forEach((c, i) => { if (c.mine && !c.flag && c.show !== "hit") c.show = "mine"; else if (!c.mine && c.flag) c.show = "wrong"; paint(i); });
  setTimeout(() => { if (state === "over") showMsg("Boom!", "You hit a mine after " + secs + " seconds.", "Try again"); }, 1000);
}
function win(){
  state = "won"; clearInterval(timer);
  cells.forEach((c, i) => { if (c.mine && !c.flag){ c.flag = true; paint(i); } }); flags = MINES; hud(); sfx.win();
  const isBest = !best || secs < best;
  if (isBest){ best = secs; $("best").textContent = secs + "s"; try { localStorage.setItem("mines-best-" + level, secs); } catch(e) {} }
  setTimeout(() => { if (state === "won") showMsg("You cleared it!", "Time: " + secs + "s." + (isBest ? " New best!" : " Best: " + best + "s."), "Play again"); }, 900);
}
function showMsg(t, x, b){ $("mtitle").textContent = t; $("mtext").textContent = x; $("mainBtn").textContent = b; $("msg").hidden = false; $("mainBtn").focus(); }
function showMenu(){ state = "menu"; clearInterval(timer); $("msg").hidden = true; $("menu").hidden = false; }
function setMode(){ const b = $("mode"); b.textContent = flagMode ? "🚩 Flag" : "⛏️ Dig"; b.classList.toggle("on", flagMode); b.setAttribute("aria-pressed", flagMode); }

/* Input: tap = dig (or flag in flag mode), long-press / right-click = flag */
let pressTimer = null, longDone = false, pressI = -1;
const grid = $("grid");
const idx = e => { const b = e.target.closest(".cell"); return b ? +b.dataset.i : -1; };
grid.addEventListener("pointerdown", e => {
  if (e.button > 0) return; const i = idx(e); if (i < 0) return; ac();
  pressI = i; longDone = false; clearTimeout(pressTimer);
  pressTimer = setTimeout(() => { longDone = true; if (navigator.vibrate) navigator.vibrate(30); toggleFlag(i); }, 380);
});
function endPress(e, cancel){
  clearTimeout(pressTimer);
  if (cancel || pressI < 0) { pressI = -1; return; }
  const i = pressI; pressI = -1;
  if (longDone || idx(e) !== i) return;
  flagMode ? toggleFlag(i) : dig(i);
}
grid.addEventListener("pointerup", e => endPress(e, false));
grid.addEventListener("pointercancel", e => endPress(e, true));
grid.addEventListener("pointerleave", e => { clearTimeout(pressTimer); pressI = -1; });
grid.addEventListener("contextmenu", e => { e.preventDefault(); const i = idx(e); if (i >= 0 && !longDone) toggleFlag(i); });
grid.addEventListener("keydown", e => {
  const i = idx(e); if (i < 0) return;
  if (e.key === "Enter" || e.key === " "){ e.preventDefault(); flagMode ? toggleFlag(i) : dig(i); }
  else if (e.key === "f" || e.key === "F"){ e.preventDefault(); toggleFlag(i); }
});
document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => startGame(b.dataset.l)));
$("mainBtn").addEventListener("click", () => startGame(level));
$("altBtn").addEventListener("click", showMenu);
$("restart").addEventListener("click", () => { if (state !== "menu") startGame(level); });
$("change").addEventListener("click", showMenu);
$("mode").addEventListener("click", () => { flagMode = !flagMode; setMode(); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) clearInterval(timer);
  else if (state === "playing" && started) startTimer();
});
N = LEVELS.medium.n; MINES = LEVELS.medium.mines; build(); loadBest(); hud();
</script>
</body>
</html>
